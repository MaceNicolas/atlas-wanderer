<style>
  /* Instruction under the dungeon on the hero selection: same label style as the site (small uppercase Oxanium, wide tracking, cyan, thin rules on both sides) */
  .consigne { display: flex; align-items: center; justify-content: center; gap: var(--s-3); margin: var(--s-1) 0; color: var(--signal); font: 600 var(--fs-sm)/1.2 var(--font-display); letter-spacing: .22em; text-transform: uppercase; text-align: center; }
  .consigne::before, .consigne::after { content: ""; flex: 0 1 4rem; height: 1px; background: currentColor; opacity: .6; }
  /* Card size: the game must fit on the screen. Board (whole card), hand (two thirds of a card) and hero banner (lengthwise, about one card width) in height,
     seven cards side by side in width; we take the smaller of the two constraints (card ratio: --card-ratio, set by the game from the layout of the cards: 330/200 for the vector card, 4/3 on a frame). */
  :root { --card-w: clamp(8rem, min(calc((100dvh - 340px) / (3 * var(--card-ratio, 1.65))), calc((100vw - 150px) / 7)), 15rem); }
  .combat { /* game screens: same cards in reinforcement and in combat */
    --card-w: clamp(8.5rem, min(calc((100dvh - 300px) / (2.376 * var(--card-ratio, 1.65))), calc((100vw - 150px) / 7)), 18rem); }
  /* Compact cards (boards): when the mod draws them (class compact-boards, set by the game), the cards of the boards are shorter, so they can be wider for the same screen height:
     four blocks of the same height (--block-h: the two boards and the hand of compact cards, shown whole, then the last row: dungeon card, console, hero cards) separated by one thin gap (--gap), also above the first and below the last: 5 gaps, the rest being the margins, the paddings and the 5 thin gaps. The hand, the hero banner and the boards then use the same card width. */
  .combat { --board-w: var(--card-w); }
  .compact-boards .combat { --peek: var(--board-ratio, 1.65); --gap: 6px; --last-w: 2.3; --block-h: calc(var(--card-w) * var(--board-ratio, 1.65) + 1.25rem); /* the hand is shown whole as compact cards */
    --game-w: min(calc(100vw - 3rem), 1700px);   /* the game screens are wider than the other pages: the cards of the boards are the point of the screen */
    --card-w: clamp(8.5rem, min(calc((100dvh - 40px - 4 * 1.25rem - 5 * var(--gap)) / (4 * var(--board-ratio, 1.65))), calc((var(--game-w) - 80px) / 7)), 18rem);
    position: relative; left: 50%; width: var(--game-w); margin-left: calc(var(--game-w) / -2); }
  .compact-boards .combat { padding: var(--gap) 0; justify-content: center; }   /* what is left of the height is shared above and below, never between the blocks */
  .compact-boards .combat > div:first-child { flex: none; margin-bottom: var(--gap); }
  .compact-boards .combat > div:last-child { margin-top: 0; }
  .compact-boards .combat .plateau-donjon, .compact-boards .combat .plateau { flex: none; height: var(--block-h); margin: 0 0 var(--gap); padding: .5rem .75rem; }
  .compact-boards .combat .plateau { margin-bottom: 0; }
  .compact-boards .combat .hand-block { margin-top: 0; margin-bottom: var(--gap); height: var(--block-h); box-sizing: border-box; align-items: center; }
  .compact-boards .combat .last-block { margin: 0; padding: 0; background: none; min-height: var(--block-h); box-sizing: border-box; align-items: center; }
  .carte-compacte { position: relative; border-radius: 0; outline: none; transition: filter .12s, transform .12s; }
  .carte-compacte > svg { display: block; }
  .carte-compacte.halo, .carte-compacte.halo-hover:hover { filter: drop-shadow(0 0 3px var(--halo, #fff)) drop-shadow(0 0 9px var(--halo, #fff)); }
  .carte-compacte:focus-visible { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px var(--signal)); }
  /* The full card shown over a compact card: placed by the game (fixed), never catches the pointer, so the board does not move or flicker. */
  #carte-pleine { position: fixed; z-index: 95; pointer-events: none; filter: drop-shadow(0 12px 28px rgba(0,0,0,.65)); }
  /* The main color and the roundings of the game come from the theme of the mod (theme.css, loaded by mods.js). */
  body { font-family: var(--font-text); }
  h1, h2, h3 { font-family: var(--font-display); letter-spacing: var(--track-title); }

  .drop-zone { outline: 3px dashed var(--signal); outline-offset: 4px; border-radius: 1rem; }
  #app { position: relative; z-index: 1; }
  /* Reinforcement banner: single console, level and Datacrons blended into it */
  .console-renfort { position: relative; background: radial-gradient(ellipse at 15% 50%, rgba(139,92,246,.2), transparent 55%), radial-gradient(ellipse at 90% 50%, rgba(245,197,66,.14), transparent 50%), linear-gradient(180deg, #0d1424, #080c18); border: 1px solid var(--line-strong); }
  .console-renfort .text-3xl, .console-renfort h3 { font-family: var(--font-display); }
  /* Corner brackets, shared by every game panel (colour: --bracket). */
  .console-renfort::after, .plateau::after, .plateau-donjon::after, .offre-calque::after, .choix-calque::after, .cadre::after { content: ''; position: absolute; inset: -1px; pointer-events: none; z-index: 3; border-radius: inherit;
    background: linear-gradient(var(--bracket, var(--signal)), var(--bracket, var(--signal))) top left / 18px 2px no-repeat, linear-gradient(var(--bracket, var(--signal)), var(--bracket, var(--signal))) top left / 2px 18px no-repeat,
      linear-gradient(var(--bracket, var(--signal)), var(--bracket, var(--signal))) bottom right / 18px 2px no-repeat, linear-gradient(var(--bracket, var(--signal)), var(--bracket, var(--signal))) bottom right / 2px 18px no-repeat; opacity: .85; }
  /* Console block (last row): rectangular, with the double silver border of the cards. The header (level icon and number, horizontal chevrons, money) and the footer (the three actions) are part of the border. Same height as the other blocks. */
  .console-block { --cb: calc(var(--card-w) * var(--last-w, 2) / 400 * 5.5); border: var(--cb) solid #5b8cc4; border-image: linear-gradient(135deg, #eaf4ff 0%, #4f86c0 20%, #b4d6f7 42%, #2a5a96 66%, #9ccaf3 86%, #4f86c0 100%) 1; box-shadow: none;
    align-self: center; height: calc(var(--card-w) * var(--last-w, 2) * .475); min-height: 9rem; box-sizing: border-box; background: linear-gradient(180deg, #0d1424, #080c18); }   /* blue brushed-metal border, rectangular; same height as the dungeon and hero cards (400 x 190) */
  .console-block::after { display: none; }
  .console-bar { display: flex; justify-content: center; padding: .3rem; }
  /* Level and Datacron tabs, set into the border of the console (same blue metallic edge, same thickness) in the top corners: a trapezoid whose inner side is slanted, like the red banners of the cards.
     --h: height, --s: how far the slanted side leans. The edge layer is the whole shape, the fill layer the same shape inset by the thickness of the border. */
  .console-tag { --edge-grad: linear-gradient(180deg, #d9e9fb, #8dbbea 50%, #5a8fc9); --h: 3.6rem; --s: 1.5rem; position: absolute; top: calc(var(--cb) * -1); z-index: 4; isolation: isolate; display: flex; align-items: center; gap: .6rem; height: var(--h); box-sizing: border-box; }
  .console-tag::before, .console-tag::after { content: ''; position: absolute; z-index: -1; }
  .console-tag::before { inset: 0; background: var(--edge-grad); }
  .console-tag::after { background: linear-gradient(180deg, #1d2342, #0d1424); }
  .console-tag-level { --cw: 2.6rem; --k: .65; --t: calc(var(--cb) * 1.13); left: calc(var(--cb) * -1); padding: 0; gap: 0; }   /* --k: slope of a chevron (.45 cw / half the height), --t: horizontal thickness of the border on a slanted side */
  .console-tag-level::before, .console-tag-level::after { display: none; }   /* the shape of this tab is its pieces: the number block, then one chevron per step of the progress, lit when reached */
  .console-tag-level > *, .console-tag-level .chevrons i { position: relative; isolation: isolate; }
  .console-tag-level .lvl-num { --p: calc(var(--cw) * .45); height: 100%; box-sizing: border-box; display: flex; align-items: center; padding: var(--cb) calc(var(--p) + .3rem) 0 1rem; }
  .console-tag-level .lvl-num::before, .console-tag-level .chevrons i::before, .console-tag-level .lvl-num::after, .console-tag-level .chevrons i::after { content: ''; position: absolute; z-index: -1; }
  .console-tag-level .lvl-num::before { inset: 0; background: var(--edge-grad); clip-path: polygon(0 0, calc(100% - var(--p)) 0, 100% 50%, calc(100% - var(--p)) 100%, 0 100%); }
  .console-tag-level .lvl-num::after { inset: 0; background: linear-gradient(180deg, #1d2342, #0d1424); clip-path: polygon(var(--cb) var(--cb), calc(100% - var(--p) + var(--k) * var(--cb) - var(--t)) var(--cb), calc(100% - var(--t)) 50%, calc(100% - var(--p) + var(--k) * var(--cb) - var(--t)) calc(100% - var(--cb)), var(--cb) calc(100% - var(--cb))); }
  .console-tag-level .chevrons { display: flex; height: 100%; padding: 0; margin-left: calc(var(--cw) * -.45 - var(--t)); }
  .console-tag-level .chevrons i { width: var(--cw); height: 100%; margin-right: calc(var(--cw) * -.45 - var(--t)); background: none; clip-path: none; filter: none; }
  .console-tag-level .chevrons i:last-child { margin-right: 0; }
  .console-tag-level .chevrons i::before { inset: 0; background: var(--edge-grad); clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%, 45% 50%); }
  .console-tag-level .chevrons i::after { inset: 0; background: linear-gradient(180deg, #232a52, #0f1630); clip-path: polygon(calc(var(--k) * var(--cb) + var(--t)) var(--cb), calc(var(--cw) * .55 + var(--k) * var(--cb) - var(--t)) var(--cb), calc(var(--cw) - var(--t)) 50%, calc(var(--cw) * .55 + var(--k) * var(--cb) - var(--t)) calc(100% - var(--cb)), calc(var(--k) * var(--cb) + var(--t)) calc(100% - var(--cb)), calc(var(--cw) * .45 + var(--t)) 50%); }
  .console-tag-level .chevrons i.on { background: none; filter: drop-shadow(0 0 6px rgba(185,168,255,.75)); }
  .console-tag-level .chevrons i.on::after { background: linear-gradient(180deg, #f1ecff, #B9A8FF 55%, #8d77ee); }
  .console-tag-money { right: calc(var(--cb) * -1); padding: var(--cb) 1.5rem 0 calc(var(--s) + 1.3rem); }
  .console-tag-money::after { background: linear-gradient(180deg, #f4f7fc, #c9d1de 52%, #8f9bb0); }   /* the Datacron tab is silver (the Datacron is a silver coin in this universe) */
  .console-tag-money::before { clip-path: polygon(0 0, 100% 0, 100% 100%, var(--s) 100%); }
  .console-tag-money::after { inset: var(--cb) var(--cb) var(--cb) 0; clip-path: polygon(calc(var(--cb) * 1.1) 0, 100% 0, 100% 100%, calc(var(--cb) * 1.1 + var(--s) * (var(--h) - var(--cb) * 2) / var(--h)) 100%); }
  .console-status { display: flex; align-items: center; gap: .6rem; padding: 0 1rem; font: 600 .82rem/1.2 var(--font-display); letter-spacing: .18em; text-transform: uppercase; text-align: center; color: var(--signal); }
  .console-status i { flex: none; width: .55rem; height: .55rem; background: currentColor; transform: rotate(45deg); animation: console-pulse 1.4s ease-in-out infinite; }
  @keyframes console-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .console-tab { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; padding: .4rem .25rem; color: #e0f2fe; cursor: pointer; font-family: var(--font-display); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; text-align: center; background: none; border: 0; transition: filter var(--t-fast), transform var(--t-fast); }
