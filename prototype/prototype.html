<!doctype html>
<html lang="fr" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Wanderer – Prototype</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="stylesheet" href="../site/space.css">
<style>
  /* Card size: the game must fit on the screen. Board (whole card), hand (two thirds of a card) and lieutenant banner (lengthwise, about one card width) in height,
     seven cards side by side in width; we take the smaller of the two constraints (card ratio: 330/200). */
  :root { --card-w: clamp(6.5rem, min(calc((100dvh - 375px) / 4.95), calc((100vw - 150px) / 7)), 13rem); }
  .combat { /* game screens: same cards in reinforcement and in combat */
    --card-w: clamp(6.5rem, min(calc((100dvh - 430px) / 3.92), calc((100vw - 150px) / 7)), 16rem); }
  /* Main color of the game: the yellow of the selection outline (UI.gold in svg.js) */
  html[data-theme] { --p: 84.4% 0.151 87.9; --pc: 20% 0.02 88; }
  /* Drag and drop: drop markers */
  .drop-l { box-shadow: -8px 0 0 0 #3b82f6; }
  .drop-r { box-shadow: 8px 0 0 0 #3b82f6; }
  .drop-on { outline: 4px solid #3b82f6; outline-offset: 2px; }
  .drop-zone { outline: 3px dashed #3b82f6; outline-offset: 4px; border-radius: 1rem; }
  #app { position: relative; z-index: 1; }
  /* Reinforcement banner: single console, level and Datacrons blended into it */
  .console-renfort { background: radial-gradient(ellipse at 15% 50%, rgba(139,92,246,.22), transparent 55%), radial-gradient(ellipse at 90% 50%, rgba(245,197,66,.16), transparent 50%), linear-gradient(180deg, #0d1424, #080c18); border: 1px solid rgba(56,189,248,.28); }
  .barre-crantee { display: flex; gap: 4px; padding-left: 6px; }
  .barre-crantee { flex: 1; max-width: 9rem; }
  .barre-crantee i { flex: 1 1 0; max-width: 22px; height: 10px; transform: skewX(-30deg); background: rgba(185,168,255,.2); border-radius: 2px; }
  .barre-crantee i.on { background: linear-gradient(#d9ceff, #B9A8FF); box-shadow: 0 0 6px rgba(185,168,255,.6); }
  .btn-achat { min-height: 3.25rem; color: #e0f2fe; cursor: pointer; transition: transform .1s, filter .1s, box-shadow .1s;
    border-radius: .5rem; border: 1px solid rgba(125,211,252,.3); background: linear-gradient(180deg, #17304a, #0c1a2b); }
  .btn-suite { background: linear-gradient(180deg, #5a2012, #2e0e07); border-color: rgba(251,113,60,.6); color: #ffedd5; }
  .btn-or { background: linear-gradient(180deg, #f5c542, #c8961a); border-color: rgba(255,224,138,.8); color: #1a1304; }
  .btn-danger { background: linear-gradient(180deg, #4a1717, #260b0b); border-color: rgba(248,113,113,.5); color: #fecaca; }
  .btn-petit { min-height: 0; padding: .2rem .6rem; font-size: .75rem; border-radius: .4rem; }
  /* Reinforcement offer: layer placed over the lieutenant and reinforcement banner */
  .offre-calque { background: rgba(8,12,24,.9); backdrop-filter: blur(3px); border: 2px solid rgba(245,197,66,.7); box-shadow: 0 0 40px rgba(0,0,0,.6); }
  /* Board: own frame and tint (cyan), distinct from the rest of the screen */
  .plateau-donjon { position: relative; overflow: hidden; border: 2px solid rgba(251,113,60,.65); background: radial-gradient(ellipse at 50% 0%, rgba(251,113,60,.16), transparent 70%), linear-gradient(180deg, rgba(48,16,10,.75), rgba(26,8,6,.75)); box-shadow: 0 0 24px rgba(251,113,60,.18), inset 0 0 30px rgba(251,113,60,.08); }
  .plateau-donjon > .decor { position: absolute; inset: 0; opacity: .22; pointer-events: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
  .plateau-donjon > .decor svg { width: 100%; height: 100%; }
  .plateau { border: 2px solid rgba(34,211,238,.6); background: radial-gradient(ellipse at 50% 0%, rgba(34,211,238,.14), transparent 70%), linear-gradient(180deg, rgba(8,40,52,.7), rgba(5,20,30,.7)); box-shadow: 0 0 24px rgba(34,211,238,.18), inset 0 0 30px rgba(34,211,238,.08); }
  /* Hand: only the top of the cards is visible, blending into the banner just below; on hover, the card unfolds */
  .main-carte > svg { -webkit-mask-image: linear-gradient(#000 45%, transparent 100%); mask-image: linear-gradient(#000 45%, transparent 100%); }
  .main-carte:hover { overflow: visible; z-index: 30; }
  .main-carte:hover > svg { -webkit-mask-image: none; mask-image: none; }
  .btn-jeter { opacity: 0; padding: .3rem; line-height: 0; }
  .main-carte:hover .btn-jeter:not(:disabled) { opacity: 1; }
  .btn-compact { min-height: 2.5rem; font-size: .85rem; }
  .btn-achat:not(:disabled):hover { transform: translateY(-2px); filter: brightness(1.35) drop-shadow(0 0 6px rgba(125,211,252,.6)); }
  /* Dungeon types mode switch: same look in both positions (only the knob moves) */
  .toggle-fixe, .toggle-fixe:checked, .toggle-fixe:hover { color: #fbbf24; --tglbg: #151a26; }
  /* Choice form (Hal Ana, fusion, Adaptation): placed exactly between the two boards, nebula background */
  .choix-calque { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: calc(100% - 1.5rem); z-index: 40; border-radius: 1rem; isolation: isolate;
    border: 2px solid rgba(167,139,250,.6); box-shadow: 0 0 40px rgba(0,0,0,.7), 0 0 36px rgba(139,92,246,.35); }
  .choix-fond { position: absolute; inset: 0; z-index: -2; border-radius: inherit; background-color: #0a0618; background-size: 160% 160%; animation: nebuleuse 40s ease-in-out infinite alternate;
    background-image: radial-gradient(ellipse at 18% 25%, rgba(124,58,237,.55), transparent 55%), radial-gradient(ellipse at 82% 30%, rgba(236,72,153,.38), transparent 52%),
      radial-gradient(ellipse at 55% 85%, rgba(34,211,238,.32), transparent 55%), radial-gradient(ellipse at 90% 90%, rgba(79,70,229,.45), transparent 50%),
      radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 60%, #cfe3ff, transparent), radial-gradient(1.5px 1.5px at 45% 80%, #fff, transparent), radial-gradient(1px 1px at 85% 15%, #ffe9c4, transparent); }
  @keyframes nebuleuse { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
  .choix-masquer { position: absolute; right: .6rem; bottom: .6rem; z-index: 20; }
  .choix-rappel { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); z-index: 40; }
  /* Hal Ana: mystic smoke drifting in front of the background */
  .choix-mystique .fumee { position: absolute; inset: 0; z-index: -1; overflow: hidden; border-radius: inherit; pointer-events: none; }
  .fumee i { position: absolute; width: 60%; height: 90%; border-radius: 50%; filter: blur(34px); opacity: .5; background: radial-gradient(closest-side, rgba(216,200,255,.75), rgba(167,139,250,.25) 60%, transparent);
    animation: fumee 16s ease-in-out infinite alternate; }
  .fumee i:nth-child(1) { left: -15%; top: 20%; }
  .fumee i:nth-child(2) { left: 35%; top: -25%; animation-duration: 21s; animation-delay: -6s; background: radial-gradient(closest-side, rgba(244,180,255,.6), rgba(192,132,252,.2) 60%, transparent); }
  .fumee i:nth-child(3) { left: 60%; top: 30%; animation-duration: 18s; animation-delay: -11s; }
  .fumee i:nth-child(4) { left: 10%; top: 55%; width: 45%; animation-duration: 24s; animation-delay: -3s; background: radial-gradient(closest-side, rgba(165,243,252,.5), rgba(103,232,249,.15) 60%, transparent); }
  .fumee i:nth-child(5) { left: 45%; top: 50%; width: 50%; animation-duration: 19s; animation-delay: -14s; }
  @keyframes fumee { 0% { transform: translate(-8%, 6%) scale(.9) rotate(0deg); opacity: .25; } 50% { opacity: .6; } 100% { transform: translate(14%, -10%) scale(1.25) rotate(25deg); opacity: .3; } }
  .btn-achat:disabled { cursor: not-allowed; filter: grayscale(.8) brightness(.55); }
</style>
</head>
<body class="min-h-screen">
<div class="espace"></div>
<div id="lang-switch" class="fixed top-2 right-2 z-40 flex gap-1 text-xs"></div>
<div id="app" class="mx-auto max-w-[1320px] p-3 sm:p-5"></div>

<script src="images.js"></script>
<script src="i18n.js"></script>
<script src="svg.js"></script>
<script src="data.js"></script>
<script src="powers.js"></script>
<script src="engine.js"></script>
<script src="save.js"></script>
<script src="animations.js"></script>
<script src="stats.js"></script>
<script src="ui.js"></script>
</body>
</html>
