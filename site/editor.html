<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Wanderer – Éditeur de pouvoirs</title>
<link rel="stylesheet" href="space.css">
<link rel="stylesheet" href="tokens.css?v=4">
<link rel="stylesheet" href="site.css?v=4">
<style>
  /* Buttons, fields and panels: site.css. Only the layout of the editor is here. */
  .cols { display: grid; grid-template-columns: 260px 1fr; gap: var(--s-4); }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  #list { max-height: 75vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface-1); }
  #list button { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; cursor: pointer; transition: background var(--t-fast), color var(--t-fast); }
  #list button:hover { background: rgba(92, 212, 240, .07); }
  #list button[aria-pressed="true"] { background: rgba(251, 146, 60, .15); color: var(--dev); box-shadow: inset 3px 0 0 var(--dev); }
  #list button:focus-visible { outline-offset: -3px; }
  textarea { width: 100%; min-height: 320px; font: .85rem/1.5 var(--font-mono); }
  .btn { margin-right: var(--s-2); }
  table.b { font-size: .85rem; }
</style>
</head>
<body>
<div class="espace"></div>
<header class="entete"><div>
  <a class="marque" href="../index.html">Atlas Wanderer</a>
  <input type="checkbox" id="menu" class="menu-case" aria-label="Menu"><label for="menu" class="burger" aria-hidden="true"><span></span></label>
  <nav>
    <a href="../index.html">Présentation</a>
    <a href="rules.html">Règles</a>
    <a href="lieutenants.html">Lieutenants</a>
    <a href="servants.html">Serviteurs</a>
    <a href="equipment.html">Équipements</a>
    <a href="tests.html" class="nav-test" hidden>Test</a>
    <a href="editor.html" class="nav-test" aria-current="page" hidden>Éditeur</a>
  </nav>
  <a class="bouton plein" href="../prototype/prototype.html">Jouer</a>
</div></header>
<main class="page large">
  <h1>Éditeur</h1>
  <p>Modèles de <code>data/powers.json</code>. Modifiez le JSON, vérifiez, essayez sur un plateau d'exemple, puis enregistrez (le fichier est réécrit par le serveur local).</p>
  <p class="onglets"><button id="tabPowers" aria-pressed="true">Pouvoirs</button><button id="tabCards" aria-pressed="false">Cartes</button><button id="tabTexts" aria-pressed="false">Textes</button><button id="tabRules" aria-pressed="false">Règles</button></p>
  <div class="cols">
    <div><input type="search" id="filter" placeholder="Filtrer…" style="width:100%;box-sizing:border-box"><div id="list"></div></div>
    <div id="main"><p>Chargement…</p></div>
  </div>
</main>
<script src="link-test.js"></script>
<script src="../prototype/i18n.js"></script>
<script src="../prototype/data.js"></script>
<script src="../prototype/powers.js"></script>
<script src="../prototype/engine.js"></script>
<script src="editor-core.js"></script>
<script>
(async () => {
  if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) { document.getElementById('main').textContent = "L'éditeur n'est disponible qu'avec le serveur local (node tools/local-server.js)."; return; }
  await Promise.all([I18N.ready, POWERS.ready, CATALOG.ready]);
  const env = { SERVANTS, EQUIPS, HEROES, mkServant, applyEquip, applyFx, POWERS, setSeed };
  const $ = id => document.getElementById(id), main = $('main');
  let defs = JSON.parse(JSON.stringify(POWERS.all())), current = null, lang = 'fr';
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const board = rows => '<table class="b"><tr><th>Nom</th><th>ATQ</th><th>PV</th><th>Bouclier</th><th>Mots-clés</th></tr>' + rows.map(r => `<tr><td>${esc(r.name)}</td><td>${r.atk}</td><td>${r.hp}/${r.maxhp}</td><td>${r.shield}</td><td>${esc(r.kw)}</td></tr>`).join('') + '</table>';

  let mode = 'powers', category = 'servants', files = {};
  const labelOf = id => mode === 'cards' ? (I18N.text('fr', 'card.' + id) || id) : id;
  function drawList() {
    const f = $('filter').value.toLowerCase();
    $('list').innerHTML = '';
    if (mode === 'cards') {
      const sel = document.createElement('select'); sel.style.width = '100%';
      EditorCore.CARD_FIELDS && Object.keys(EditorCore.CARD_FIELDS).forEach(c => sel.add(new Option(c, c)));
      sel.value = category; sel.onchange = () => { category = sel.value; current = null; main.innerHTML = ''; drawList(); };
      $('list').appendChild(sel);
      const add = document.createElement('button'); add.textContent = '+ Nouvelle carte'; add.onclick = createCard; $('list').appendChild(add);
    }
    const ids = mode === 'cards' ? Object.keys(files[category].cards) : Object.keys(defs);
    for (const id of ids.filter(k => labelOf(k).toLowerCase().includes(f))) {
      const b = document.createElement('button'); b.textContent = labelOf(id); b.setAttribute('aria-pressed', id === current);
      b.onclick = () => mode === 'cards' ? selectCard(id) : select(id); $('list').appendChild(b);
    }
  }
  async function loadFiles() {
    for (const c of Object.keys(EditorCore.CARD_FIELDS)) files[c] = await (await fetch(`../data/${c}.json`, { cache: 'no-cache' })).json();
  }
  const known = () => EditorCore.knownFrom(files, Object.keys(TYPE_NAMES), Object.keys(POWERS.all()));
  // Texts attached to a card: its name, and for a dungeon the Boss's name and description.
  const textFields = id => [['card.' + id, 'Nom']].concat(category === 'dungeons' ? [['boss.' + id, 'Nom du Boss'], ['boss.' + id + '.desc', 'Description du Boss']] : []);
  const post = async (name, content) => {
    const r = await fetch('/api/save/' + name, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(content) });
    const body = await r.json().catch(() => ({}));
    return { ok: r.ok, problems: body.problems || [body.failure || r.status] };
  };
  // Writes the texts of the card (fr, then en when filled) and its file; fresh = the card is being created.
  async function saveCard(id, card, fresh) {
    const status = $('status');
    for (const lang of ['fr', 'en']) {
      let next = { ...texts[lang] };
      for (const [key] of textFields(id)) { const v = $('t-' + lang + '-' + key).value.trim(); if (v || lang === 'fr') next[key] = v; }
      if (JSON.stringify(next) === JSON.stringify(texts[lang])) continue;
      if (lang === 'fr' && textFields(id).some(([key]) => !next[key])) { status.innerHTML = '<span class="ko">Le texte français est obligatoire.</span>'; return false; }
      const r = await post('i18n-' + lang, next);
      if (!r.ok) { status.innerHTML = `<span class="ko">Texte refusé (${lang}) : ${esc(r.problems.join(' / '))}</span>`; return false; }
      texts[lang] = next;
    }
    const nextFile = { ...files[category], cards: { ...files[category].cards, [id]: card } };
    const r = await post(category, nextFile);
    if (!r.ok) { status.innerHTML = `<span class="ko">Refusé : ${esc(r.problems.join(' / '))}</span>`; return false; }
    files[category] = nextFile;
    return true;
  }
  function selectCard(id, fresh) {
    current = id; drawList();
    const fields = textFields(id).map(([key, label]) => `<p>${label} — fr <input id="t-fr-${key}" style="width:18em"> en <input id="t-en-${key}" style="width:18em" placeholder="(non traduit)"></p>`).join('');
    main.innerHTML = `<h2>${esc(fresh ? 'Nouvelle carte' : labelOf(id))} <small>(${category})</small></h2>${fields}<textarea id="json" spellcheck="false"></textarea><p id="status"></p><p>Pouvoirs, tels que le joueur les lit (descriptions à modifier dans l'onglet Pouvoirs) : <i id="pdesc"></i></p><p><button class="btn" id="save">Enregistrer</button>${fresh ? '' : '<button class="btn" id="retire">Retirer du jeu</button>'}</p>`;
    for (const [key] of textFields(id)) { $('t-fr-' + key).value = texts.fr[key] || ''; $('t-en-' + key).value = texts.en[key] || ''; }
    $('json').value = JSON.stringify(fresh || files[category].cards[id], null, 1);
    const check = () => {
      const p = parsed(), st = $('status');
      if (p.error) { st.innerHTML = `<span class="ko">${esc(p.error)}</span>`; $('save').disabled = true; return; }
      const problems = EditorCore.validateCard(category, p.def, known());
      st.innerHTML = problems.length ? `<span class="ko">${problems.map(esc).join('<br>')}</span>` : '<span class="ok">✓ carte valide</span>';
      $('save').disabled = problems.length > 0;
      const skills = category === 'lieutenants' ? [p.def.power] : p.def.skill;
      $('pdesc').textContent = [].concat(skills || []).filter(Boolean).map(k => { try { return skDesc(k); } catch (e) { return '?'; } }).join(' • ');
    };
    $('json').oninput = check; check();
    $('save').onclick = async () => {
      if (await saveCard(id, parsed().def, !!fresh)) { $('status').innerHTML = '<span class="ok">✓ enregistré (rechargez le jeu pour voir la carte)</span>'; drawList(); if (fresh) selectCard(id); }
    };
    if (!fresh) $('retire').onclick = async () => {
      if (!confirm('Retirer cette carte du jeu ? Ses textes restent (anciennes sauvegardes), elle est listée dans data/retired.json.')) return;
      const retired = EditorCore.retire(await (await fetch('../data/retired.json', { cache: 'no-cache' })).json(), category, id);
      const { [id]: gone, ...rest } = files[category].cards, nextFile = { ...files[category], cards: rest };
      const r1 = await post('retired', retired);
      const r2 = r1.ok && await post(category, nextFile);
      if (!r1.ok || !r2.ok) { $('status').innerHTML = `<span class="ko">Refusé : ${esc((r1.ok ? r2 : r1).problems.join(' / '))}</span>`; return; }
      files[category] = nextFile; current = null; main.innerHTML = '<p>Carte retirée.</p>'; drawList();
    };
  }
  function createCard() {
    selectCard(crypto.randomUUID(), EditorCore.newCard(category));
  }
  // ---- Texts and rules ----
  let texts = { fr: {}, en: {} }, rules = null;
  async function loadTexts() { for (const l of ['fr', 'en']) texts[l] = await (await fetch(`../data/i18n/${l}.json`, { cache: 'no-cache' })).json(); }
  function drawTexts() {
    const f = $('filter').value.toLowerCase();
    $('list').innerHTML = '';
    for (const key of Object.keys(texts.fr).filter(k => !/^(card|boss)\./.test(k)).filter(k => k.toLowerCase().includes(f) || texts.fr[k].toLowerCase().includes(f)).slice(0, 400)) {
      const b = document.createElement('button'); b.textContent = key; b.setAttribute('aria-pressed', key === current);
      b.onclick = () => selectText(key); $('list').appendChild(b);
    }
  }
  function selectText(key) {
    current = key; drawTexts();
    main.innerHTML = `<h2>${esc(key)}</h2><p>Français</p><textarea id="tfr" style="min-height:90px"></textarea><p>English</p><textarea id="ten" style="min-height:90px"></textarea><p id="status"></p><p><button class="btn" id="save">Enregistrer</button></p>`;
    $('tfr').value = texts.fr[key] || ''; $('ten').value = texts.en[key] || '';
    const check = () => {
      const a = EditorCore.placeholdersOf($('tfr').value).join(), b = EditorCore.placeholdersOf($('ten').value).join(), en = $('ten').value;
      $('status').innerHTML = en && a !== b ? '<span class="ko">Les {paramètres} diffèrent entre le français et l\'anglais.</span>' : '<span class="ok">✓</span>';
      $('save').disabled = !!(en && a !== b);
    };
    $('tfr').oninput = $('ten').oninput = check; check();
    $('save').onclick = async () => {
      for (const [lang, id] of [['fr', 'tfr'], ['en', 'ten']]) {
        const v = $(id).value; if (v === (texts[lang][key] || '') || (!v && lang === 'en')) continue;
        const next = { ...texts[lang], [key]: v };
        const r = await fetch('/api/save/i18n-' + lang, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(next) });
        const body = await r.json().catch(() => ({}));
        if (!r.ok) { $('status').innerHTML = `<span class="ko">Refusé (${lang}) : ${esc((body.problems || [body.failure]).join(' / '))}</span>`; return; }
        texts[lang] = next;
      }
      $('status').innerHTML = '<span class="ok">✓ enregistré</span>';
    };
  }
  async function showRules() {
    rules = await (await fetch('../data/rules.json', { cache: 'no-cache' })).json();
    $('list').innerHTML = ''; current = null;
    main.innerHTML = `<h2>Règles (data/rules.json)</h2><textarea id="json" spellcheck="false"></textarea><p id="status"></p><p><button class="btn" id="save">Enregistrer</button></p>`;
    $('json').value = JSON.stringify(rules, null, 1);
    const check = () => { const p = parsed(); const problems = p.error ? [p.error] : EditorCore.validateRules(p.def); $('status').innerHTML = problems.length ? `<span class="ko">${problems.map(esc).join('<br>')}</span>` : '<span class="ok">✓ règles valides</span>'; $('save').disabled = problems.length > 0; };
    $('json').oninput = check; check();
    $('save').onclick = async () => {
      const next = parsed().def, r = await fetch('/api/save/rules', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(next) });
      const body = await r.json().catch(() => ({}));
      $('status').innerHTML = r.ok ? '<span class="ok">✓ enregistré (rechargez le jeu)</span>' : `<span class="ko">Refusé : ${esc((body.problems || [body.failure]).join(' / '))}</span>`;
    };
  }
  // Display only: the active tab is lit (aria-pressed).
  const markTab = () => Object.entries({ powers: 'tabPowers', cards: 'tabCards', texts: 'tabTexts', rules: 'tabRules' }).forEach(([m, id]) => $(id).setAttribute('aria-pressed', m === mode));
  $('tabTexts').onclick = async () => { await loadTexts(); mode = 'texts'; markTab(); current = null; main.innerHTML = ''; drawTexts(); };
  $('tabRules').onclick = async () => { mode = 'rules'; markTab(); await showRules(); };
  $('tabPowers').onclick = async () => { await loadTexts(); mode = 'powers'; markTab(); current = null; main.innerHTML = ''; drawList(); };
  $('tabCards').onclick = async () => { await loadFiles(); await loadTexts(); mode = 'cards'; markTab(); current = null; main.innerHTML = ''; drawList(); };
  function select(id) {
    current = id; drawList();
    const uses = EditorCore.usageOf(id, env);
    main.innerHTML = `<h2>${esc(id)} <small>(${EditorCore.kindOf(defs[id])})</small></h2>
      <p>Description — fr <input id="dfr" style="width:90%"></p><p>Description — en <input id="den" style="width:90%" placeholder="(non traduit)"></p>
      <p>Aperçu avec a, h, n ci-dessous : <i id="desc"></i></p>
      <p>Utilisé par : ${uses.length ? uses.map(u => esc(u.name)).join(', ') : '<em>aucune carte</em>'}</p>
      <textarea id="json" spellcheck="false"></textarea>
      <p id="status"></p>
      <p><button class="btn" id="save">Enregistrer</button><button class="btn" id="try">Essayer</button> graine <input type="number" id="seed" value="1" style="width:6em"> a <input type="number" id="pa" value="2" style="width:4em"> h <input type="number" id="ph" value="2" style="width:4em"> n <input type="number" id="pn" value="1" style="width:4em"></p>
      <div id="sandbox"></div>`;
    $('json').value = JSON.stringify(defs[id], null, 1);
    $('dfr').value = texts.fr['desc.' + id] || ''; $('den').value = texts.en['desc.' + id] || '';
    $('dfr').oninput = $('den').oninput = $('pa').oninput = $('ph').oninput = $('pn').oninput = refresh;
    $('json').oninput = refresh; $('try').onclick = tryIt; $('save').onclick = save;
    refresh();
  }
  function parsed() { try { return { def: JSON.parse($('json').value) }; } catch (e) { return { error: 'JSON invalide : ' + e.message }; } }
  function refresh() {
    const p = parsed(), st = $('status'), save = $('save');
    if (p.error) { st.innerHTML = `<span class="ko">${esc(p.error)}</span>`; save.disabled = true; return; }
    const problems = POWERS.validate(p.def);
    st.innerHTML = problems.length ? `<span class="ko">${problems.map(esc).join('<br>')}</span>` : '<span class="ok">✓ modèle valide</span>';
    save.disabled = problems.length > 0;
    const params = { a: +$('pa').value, h: +$('ph').value, n: +$('pn').value }, fr = $('dfr').value, en = $('den').value;
    $('desc').textContent = [fr && `fr : ${I18N.format(fr, params)}`, en && `en : ${I18N.format(en, params)}`].filter(Boolean).join('   |   ');
    if (en && EditorCore.placeholdersOf(fr).join() !== EditorCore.placeholdersOf(en).join()) {
      st.innerHTML += '<br><span class="ko">Les {paramètres} diffèrent entre la description française et l\'anglaise.</span>'; save.disabled = true;
    }
  }
  function tryIt() {
    const p = parsed(); if (p.error) return;
    const kind = EditorCore.kindOf(p.def), d = kind === 'reaction' || kind === 'aura' ? null : p.def;
    if (!d) { $('sandbox').innerHTML = kind === 'aura' ? '<p>Une aura se teste avec tools/check-aura.js.</p>' : '<p>Les réactions se testent en combat (tools/check-combat.js).</p>'; return; }
    const r = EditorCore.runSandbox(env, { ...defs, [current]: p.def }, current, { a: +$('pa').value, h: +$('ph').value, n: +$('pn').value }, +$('seed').value);
    $('sandbox').innerHTML = `<h3>Porteur : ${esc(r.carrier)}</h3><h4>Avant</h4>${board(r.before.allies)}${board(r.before.enemies)}<h4>Après</h4>${board(r.after.allies)}${board(r.after.enemies)}<h4>Journal</h4><pre>${esc(r.log.join('\n') || '(vide)')}</pre>`;
  }
  async function save() {
    const p = parsed(); if (p.error) return;
    const next = { ...defs, [current]: p.def };
    const r = await fetch('/api/save/powers', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(next) });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) { $('status').innerHTML = `<span class="ko">Refusé : ${esc((body.problems || [body.failure || r.status]).join(' / '))}</span>`; return; }
    defs = next; POWERS.install(defs);
    for (const [lang, id] of [['fr', 'dfr'], ['en', 'den']]) {
      const key = 'desc.' + current, v = $(id).value.trim();
      if (v === (texts[lang][key] || '') || (!v && !(key in texts[lang]))) continue;
      const nextTexts = { ...texts[lang], [key]: v };
      const rt = await fetch('/api/save/i18n-' + lang, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(nextTexts) });
      if (!rt.ok) { $('status').innerHTML = `<span class="ko">Description refusée (${lang})</span>`; return; }
      texts[lang] = nextTexts;
    }
    $('status').innerHTML = '<span class="ok">✓ enregistré (modèle dans data/powers.json, descriptions dans data/i18n)</span>';
  }
  await loadTexts();
  $('filter').oninput = () => (mode === 'texts' ? drawTexts() : drawList()); drawList();
})().catch(e => { document.getElementById('main').textContent = 'Erreur : ' + e.message; });
</script>
</body>
</html>
