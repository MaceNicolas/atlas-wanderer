<style>
  /* Buttons, fields and panels: site.css. Only the layout of the editor is here. */
  .cols { display: grid; grid-template-columns: 260px 1fr; gap: var(--s-4); }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  #list { max-height: 75vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface-1); }
  #list button { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; cursor: pointer; transition: background var(--t-fast), color var(--t-fast); }
  #list button:hover { background: rgba(92, 212, 240, .07); }
  #list button[aria-pressed="true"] { background: rgba(251, 146, 60, .15); color: var(--dev); box-shadow: inset 3px 0 0 var(--dev); }
  #list button:focus-visible { outline-offset: -3px; }
  textarea { width: 100%; min-height: 320px; font: .85rem/1.5 var(--font-mono); }
  .btn { margin-right: var(--s-2); }
  .onglets { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: var(--s-3) 0; }
  .aide { margin: var(--s-3) 0; padding: var(--s-3); border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface-1); }
  .aide summary { cursor: pointer; color: var(--dev); }
  .aide ul { margin: var(--s-2) 0; padding-left: 1.2em; }
  .liste-titre { padding: 6px 12px; font: 600 .7rem/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); background: var(--surface-0); border-bottom: 1px solid var(--line); }
  .bloc { margin: var(--s-4) 0; padding: var(--s-3) var(--s-4); border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface-1); }
  .bloc > h3 { margin: 0 0 var(--s-3); font: 600 .8rem/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--dev); }
  .fiche { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--s-4); align-items: start; }
  .apercu { position: sticky; top: var(--s-3); } .apercu h3 { margin: 0 0 var(--s-2); font: 600 .8rem/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--dev); }
  @media (max-width: 1000px) { .fiche { grid-template-columns: 1fr; } .apercu { position: static; max-width: 340px; } }
  .formulaire input[type="text"] { width: 16em; max-width: 100%; box-sizing: border-box; } .duo span { display: inline-block; min-width: 3.5em; color: var(--ink-dim); }
  .champs { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: end; } .champs label, .pouvoir label { display: inline-flex; flex-direction: column; gap: 2px; font-size: .8rem; color: var(--ink-dim); }
  .champs input[type="number"], .pouvoir input[type="number"] { width: 5em; } label.case { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); font-size: .9rem; }
  fieldset.types { border: 1px solid var(--line); border-radius: var(--r-2); margin: var(--s-2) 0; } fieldset.types legend { color: var(--ink-dim); font-size: .75rem; padding: 0 6px; }
  fieldset.types .case { display: inline-flex; margin-right: var(--s-3); }
  .pouvoir { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-3); align-items: end; padding: var(--s-3) 0; border-top: 1px solid var(--line); } .pouvoir:first-child { border-top: 0; } .pouvoir .rendu { flex-basis: 100%; margin: 0; }
  .grille-cadre { display: grid; grid-template-columns: repeat(3, 44px); gap: 4px; margin: var(--s-2) 0; }
  .grille-cadre button { height: 44px; font-size: 1.2rem; color: var(--ink); background: var(--surface-0); border: 1px solid var(--line-strong); border-radius: var(--r-1); cursor: pointer; }
  .grille-cadre button[aria-checked="true"] { background: rgba(251, 146, 60, .2); border-color: var(--dev); color: var(--dev); }
  .essai input { width: 5em; margin-right: var(--s-3); }
  .rendu { padding: var(--s-2) var(--s-3); border-left: 3px solid var(--gold); background: var(--surface-0); }
  .rendu p { margin: 4px 0; } .rendu b { color: var(--gold); margin-right: .5em; }
  .plateaux { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--s-4); }
  .plateaux h4 { margin: 0 0 var(--s-2); }
  .hausse { color: var(--ok); font-weight: 700; } .baisse { color: var(--danger); font-weight: 700; }
  tr.nouveau td { background: rgba(74, 222, 128, .08); } tr.parti td { color: var(--danger); background: rgba(248, 113, 113, .08); }
  .cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--s-4); }
  .vignette { margin: 0; } .vignette figcaption { margin-top: var(--s-2); text-align: center; font-size: .85rem; }
  .pastille { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-1); }
  table.b { font-size: .85rem; }
</style>

<main class="page large">
  <h1>Éditeur <small id="modName"></small></h1>
  <p class="discret">Mod édité : <strong id="modLabel">…</strong> · <a href="editor-mods.html">changer de mod</a></p>
  <p class="onglets"><button id="tabPowers" aria-pressed="true">Pouvoirs</button><span id="catTabs"></span><button id="tabTexts" aria-pressed="false">Textes</button><button id="tabRules" aria-pressed="false">Règles</button><button id="tabStrategies" aria-pressed="false">Stratégies</button></p>
  <div class="cols">
    <div><input type="search" id="filter" placeholder="Filtrer…" style="width:100%;box-sizing:border-box"><div id="list"></div></div>

<script src="link-test.js"></script>
<script src="../prototype/mods.js"></script>
<script src="../prototype/i18n.js"></script>
<script src="../prototype/svg.js"></script>
<script src="../prototype/data.js"></script>
<script src="../prototype/powers.js"></script>
<script src="../prototype/flow.js"></script>
<script src="../prototype/engine.js"></script>
<script src="editor-core.js"></script>
<script>
(async () => {
  if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) { document.getElementById('main').textContent = "L'éditeur n'est disponible qu'avec le serveur local (node tools/local-server.js)."; return; }
  await Promise.all([I18N.ready, POWERS.ready, CATALOG.ready]);
  if (MOD.id !== new URLSearchParams(location.search).get('mod')) throw new Error(`Le mod « ${new URLSearchParams(location.search).get('mod')} » n'existe pas.`);   // the loader would silently play the default mod: the editor refuses
  $('modLabel').textContent = (MOD.manifest.name.fr || MOD.id) + ' (' + MOD.id + ')'; document.title = 'Éditeur – ' + MOD.id;
  // The editor is in French: cards and power texts are drawn in French whatever language the player chose for the game (the saved choice is not touched).
  await I18N.load('fr');
  // liveText: texts of the card being edited, shown in the preview before they are saved.
  let liveText = {};
  AWGfx.setTexts((key, params) => (key in liveText ? liveText[key] : I18N.has(key) ? I18N.t(key, params) : key));
  // Getters: the game's lists are replaced (not modified) when the catalogue is installed again, see refreshGame.
  const env = { get SERVANTS() { return SERVANTS; }, get EQUIPS() { return EQUIPS; }, get HEROES() { return HEROES; }, mkServant, applyEquip, applyFx, POWERS, setSeed };
  const $ = id => document.getElementById(id), main = $('main');
  let defs = JSON.parse(JSON.stringify(POWERS.all())), current = null, lang = 'fr';
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  // Picture of a card, drawn like on the catalogue pages (same illustrations and layout).
  const cardPicture = u => {
    const o = { width: '100%', imgBase: MOD.imagesBase() }, c = u.card;
    try {
      if (u.kind === 'servant') { const m = mkServant(c); return AWGfx.servantCard({ ...m, kwSpent: [], powers: powersOf(m.kw, skillsOf(m), null) }, o); }
      if (u.kind === 'equipment') {
        const powers = powersOf(c.kw ? [c.kw] : [], [].concat(c.skill || []).map(k => ({ ...k })), c.mod ? { a: c.mod.summonA, h: c.mod.summonH } : null, [], true);
        return AWGfx.equipCard({ ...c, powers }, o);
      }
      if (u.kind !== 'hero') {   // a category of the mod that the engine has no drawing for: a plain sheet (name, then each field of the card)
        const rows = Object.entries(c).filter(([k]) => !['id', 'name', 'art'].includes(k)).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(typeof v === 'object' ? JSON.stringify(v) : String(v))}</td></tr>`).join('');
        return `<div class="fiche-generique"><strong>${esc(u.name)}</strong><table>${rows}</table></div>`;
      }
      return AWGfx.heroPortrait({ id: c.id, name: c.name, types: c.types, hp: c.hp, kw: c.kw, powerText: c.power ? skDesc(c.power) : '', powerKind: c.power ? TRIG_KIND[c.power.t] : 'renfort' }, o);
    } catch (e) { return `<p class="ko">${esc(u.name)} : image indisponible (${esc(e.message)})</p>`; }
  };
  // Before/after comparison of one side of the sandbox: a changed value is lit and shown as "before → after".
  const delta = (a, b) => a === b ? `${b}` : `<span class="${b > a ? 'hausse' : 'baisse'}">${a} → ${b}</span>`;
  const compare = (title, before, after) => {
    const rows = Math.max(before.length, after.length);
    let out = `<h4>${title}</h4><table class="b"><tr><th>Nom</th><th>ATQ</th><th>PV</th><th>Bouclier</th><th>Mots-clés</th></tr>`;
    for (let k = 0; k < rows; k++) {
      const x = before[k], y = after[k];
      if (!y) out += `<tr class="parti"><td>${esc(x.name)}</td><td colspan="4">retiré du plateau (mort)</td></tr>`;
      else if (!x) out += `<tr class="nouveau"><td>${esc(y.name)} <small>(nouveau)</small></td><td>${y.atk}</td><td>${y.hp}/${y.maxhp}</td><td>${y.shield}</td><td>${esc(y.kw)}</td></tr>`;
      else out += `<tr><td>${esc(y.name)}</td><td>${delta(x.atk, y.atk)}</td><td>${delta(x.hp, y.hp)}${y.maxhp !== x.maxhp ? ` <small>(max ${delta(x.maxhp, y.maxhp)})</small>` : ''}</td><td>${delta(x.shield, y.shield)}</td><td>${x.kw === y.kw ? esc(y.kw) : `<span class="hausse">${esc(y.kw)}</span>`}</td></tr>`;
    }
    return out + '</table>';
  };

  // The categories of cards come from the description of the game (game.json, categories): the tabs, the fields of a form and the lists are built from them.
  const CATEGORIES = MOD.game.categories;
  let mode = 'powers', category = Object.values(CATEGORIES)[0].file, files = {};
  const catDef = c => Object.values(CATEGORIES).find(x => x.file === (c || category));
  const fieldNames = (...types) => EditorCore.fieldsOfType(catDef(), ...types);
  const HAS_BOSS = () => fieldNames('boss').length > 0, SINGLE_POWER = () => fieldNames('power').length > 0;
  const CAT_LABELS = { servant: 'Serviteurs', equipment: 'Équipements', hero: 'Héros', dungeon: 'Donjons' };
  $('catTabs').innerHTML = Object.entries(CATEGORIES).map(([id, c]) => `<button data-cat="${c.file}" aria-pressed="false">${esc(c.label || CAT_LABELS[id] || id)}</button>`).join('');
  const labelOf = id => mode === 'cards' ? (I18N.text('fr', 'card.' + id) || id) : id;
  function drawList() {
    const f = $('filter').value.toLowerCase();
    $('list').innerHTML = '';
    if (mode === 'cards') {
      const add = document.createElement('button'); add.textContent = '+ Nouvelle carte'; add.onclick = createCard; $('list').appendChild(add);
    }
    const ids = mode === 'cards' ? Object.keys(files[category].cards) : Object.keys(defs);
    for (const id of ids.filter(k => labelOf(k).toLowerCase().includes(f))) {
      const b = document.createElement('button'); b.setAttribute('aria-pressed', id === current);
      const c = mode === 'cards' && files[category].cards[id], hint = !c ? '' : c.rank ? `rang ${c.rank}` : (c.types || [c.type]).filter(Boolean).map(typeName).join(' · ');
      b.innerHTML = esc(labelOf(id)) + (hint ? ` <small class="discret">${esc(hint)}</small>` : '');
      b.onclick = () => mode === 'cards' ? selectCard(id) : select(id); $('list').appendChild(b);
    }
    // Texts tied to this tab but with no JSON of their own (triggers, keywords, types...).
    const extra = relatedTextKeys().filter(k => k.toLowerCase().includes(f));
    if (extra.length) {
      const h = document.createElement('div'); h.className = 'liste-titre'; h.textContent = 'Textes associés'; $('list').appendChild(h);
      for (const k of extra) { const b = document.createElement('button'); b.textContent = k; b.setAttribute('aria-pressed', k === current); b.onclick = () => selectText(k); $('list').appendChild(b); }
    }
  }
  // Text keys edited on the Powers / Servants tabs (or on the card form) rather than in the Textes tab.
  const POWER_TEXTS = /^(desc|active|keyword|kwdesc|trigger)\./, CARD_TEXTS = /^(card|boss)\./, TYPE_TEXTS = /^type\./;
  const relatedTextKeys = () => Object.keys(texts.fr).filter(k => mode === 'powers' ? POWER_TEXTS.test(k) && !(k.startsWith('desc.') && defs[k.slice(5)])
    : mode === 'cards' && catDef().fields.sock != null ? TYPE_TEXTS.test(k) : false);
  // After any save: the game (texts, cards) is installed again from what the editor holds, so every view shows the new state without reloading the page.
  async function refreshGame() {
    if (!files.servants) await loadFiles();
    const [retired, rules] = await Promise.all(['retired', 'rules'].map(n => fetch(MOD.file(n), { cache: 'no-cache' }).then(r => r.json())));
    I18N.install({ fr: texts.fr, en: texts.en });
    CATALOG.install({ ...files, retired, rules });
    if (mode === 'powers' && current && defs[current]) drawUses(current);
  }
  const redraw = () => mode === 'texts' ? drawTexts() : drawList();
  async function loadFiles() {
    for (const c of Object.values(CATEGORIES).map(x => x.file)) files[c] = await (await fetch(MOD.file(c), { cache: 'no-cache' })).json();
    files.rules = await (await fetch(MOD.file('rules'), { cache: 'no-cache' })).json();   // the socket rules validate the cards
    files.vocabulary = await (await fetch(MOD.file('vocabulary'), { cache: 'no-cache' })).json();   // and so do its types and keywords
  }
  // Socket colors offered by the rules (+ the wildcard), with their French names.
  const COLOR_F = { blue: 'bleue', green: 'verte', red: 'rouge', chroma: 'chromatique' }, COLOR_M = { blue: 'bleu', green: 'vert', red: 'rouge' };
  const socketColors = () => { const s = known().sockets; return s ? [...s.colors, s.wildcard] : []; };
  const known = () => EditorCore.knownFrom(files, ALL_TYPES, Object.keys(POWERS.all()), Object.keys(TRIG_KIND), CATEGORIES);
  // Texts attached to a card: its name, and for a dungeon the Boss's name and description.
  const textFields = id => [['card.' + id, 'Nom']].concat(HAS_BOSS() ? [['boss.' + id, 'Nom du Boss'], ['boss.' + id + '.desc', 'Description du Boss']] : []);
  // The server regenerates the derived pages (documentation/cartes.md, site/*.html) after a save: a line at the bottom of the page follows it.
  async function watchRegeneration() {
    const box = $('regen');
    for (let i = 0; i < 60; i++) {
      const s = await (await fetch('/api/regeneration', { cache: 'no-store' })).json().catch(() => null);
      if (!s) return;
      if (s.state === 'idle') { box.innerHTML = s.error ? `<span class="ko">Pages non régénérées : ${esc(s.error)}</span>` : '<span class="ok">✓ pages et tableau des cartes régénérés</span>'; return; }
      box.textContent = 'Régénération des pages…';
      await new Promise(r => setTimeout(r, 500));
    }
  }
  const post = async (name, content) => {
    const r = await fetch('/api/save/' + name + '?mod=' + encodeURIComponent(MOD.id), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(content) });
    const body = await r.json().catch(() => ({}));
    return { ok: r.ok, problems: body.problems || [body.failure || r.status] };
  };
  // Writes the texts of the card (fr, then en when filled) and its file.
  async function saveCard(id, card) {
    const status = $('status');
    for (const lang of ['fr', 'en']) {
      let next = { ...texts[lang] };
      for (const [key] of textFields(id)) { const v = $('t-' + lang + '-' + key).value.trim(); if (v || lang === 'fr') next[key] = v; }
      if (JSON.stringify(next) === JSON.stringify(texts[lang])) continue;
      if (lang === 'fr' && textFields(id).some(([key]) => !next[key])) { status.innerHTML = '<span class="ko">Le texte français est obligatoire.</span>'; return false; }
      const r = await post('i18n-' + lang, next);
      if (!r.ok) { status.innerHTML = `<span class="ko">Texte refusé (${lang}) : ${esc(r.problems.join(' / '))}</span>`; return false; }
      texts[lang] = next;
    }
    const nextFile = { ...files[category], cards: { ...files[category].cards, [id]: card } };
    const r = await post(category, nextFile);
    if (!r.ok) { status.innerHTML = `<span class="ko">Refusé : ${esc(r.problems.join(' / '))}</span>`; return false; }
    files[category] = nextFile;
    await refreshGame(); watchRegeneration();
    return true;
  }

  // ---- Card form ----
  // `draft` is the card as stored in data/<category>.json; every field of the form edits it, then update() redraws what depends on it.
  let draft = null, cardId = null, fresh = false, dirty = false;
  const HAS_IMAGE = c => !!catDef(c).image, HAS_POWERS = c => EditorCore.fieldsOfType(catDef(c), 'powers', 'power').length > 0;
  const KW_NAMES = () => known().keywords.map(k => [k, AWGfx.KW_LABEL[k] || k]);
  const opt = (v, label, on) => `<option value="${esc(v)}"${on ? ' selected' : ''}>${esc(label)}</option>`;
  const typeOptions = cur => TYPE_GROUPS.map(g => [I18N.text('fr', 'group.' + g.id) || g.id, g.types]).map(([g, l]) => `<optgroup label="${g}">${l.map(t => opt(t, typeName(t), t === cur)).join('')}</optgroup>`).join('');
  const numField = (path, v, min = 0) => `<input type="number" data-f="${path}" value="${Number.isFinite(v) ? v : ''}" min="${min}">`;
  // Path set / get on the draft: "skill.0.a", "boss.hp", "art.align"...
  const setPath = (path, value) => { const keys = path.split('.'); let o = draft; keys.slice(0, -1).forEach((k, i) => { if (o[k] == null) o[k] = /^\d+$/.test(keys[i + 1]) ? [] : {}; o = o[k]; }); o[keys.at(-1)] = value; };
  // The card with the empty parts removed, as it is saved.
  function cleanCard() {
    const c = JSON.parse(JSON.stringify(draft)), art = EditorCore.cleanArt(c.art);
    if (art) c.art = art; else delete c.art;
    for (const f of Object.keys(catDef().optional || {})) if (c[f] === false || c[f] == null) delete c[f];
    return c;
  }
  // The same card as the game holds it (identifier, name, skill as null / one power / a list): what the card drawing functions expect.
  function gameCard() {
    const c = cleanCard(), shown = ($('t-fr-card.' + cardId) || { value: '' }).value || '…', skill = l => (!l || !l.length ? null : l.length === 1 ? l[0] : l);
    const base = { id: cardId, name: shown }, id = Object.keys(CATEGORIES).find(k => CATEGORIES[k].file === category);
    const first = list => skill(list);
    if (id === 'servant') return { kind: 'servant', name: shown, card: { ...base, rank: c.rank, atk: c.atk, hp: c.hp, types: c.types, sockets: c.sock || [], kw: c.kw, skill: first(c.skill) } };
    if (id === 'equipment') return { kind: 'equipment', name: shown, card: { ...base, rank: c.rank, atk: c.atk, hp: c.hp, kw: c.kw, type: c.type, color: c.color, skill: first(c.skill), mod: c.mod } };
    if (id === 'hero') return { kind: 'hero', name: shown, card: { ...base, types: c.types, hp: c.hp, kw: c.kw, power: c.power } };
    if (id === 'dungeon') {
      const v = k => ($('t-fr-' + k) || { value: '' }).value;
      return { kind: 'dungeon', name: shown, card: { ...base, type: c.type, minis: c.minis, boss: { name: v('boss.' + cardId), hp: c.boss.hp, power: c.boss.power, desc: v('boss.' + cardId + '.desc') } } };
    }
    return { kind: id, name: shown, card: { ...base, ...c } };   // a category the engine has no drawing for: cardPicture shows a plain sheet
  }
  // Framing and picture of the draft are known to the drawing functions through the same tables as the game pages (AW_ART, AW_IMAGES).
  function syncArt() {
    if (!HAS_IMAGE(category)) return;
    const art = EditorCore.cleanArt(draft.art);
    AW_ART[category] = AW_ART[category] || {};
    if (art) AW_ART[category][cardId] = art; else delete AW_ART[category][cardId];
  }
  const hasImage = () => !!(AW_IMAGES[category] || {})[cardId];
  const powerRow = (path, k, i) => `<div class="pouvoir" data-power="${path}">
      <label>Déclencheur <select data-f="${path}.t">${Object.keys(TRIG_KIND).concat(['active']).filter((t, j, a) => a.indexOf(t) === j).map(t => opt(t, `${t} — ${I18N.has('trigger.' + t) ? I18N.t('trigger.' + t) : ''}`, t === k.t)).join('')}</select></label>
      <label>Pouvoir <select data-f="${path}.fx">${Object.keys(POWERS.all()).sort().map(f => opt(f, f, f === k.fx)).join('')}</select></label>

    if (file === 'strategies' && !files.servants) await loadFiles();
    $('list').innerHTML = ''; current = null;
    main.innerHTML = `<h2>${spec.title}</h2><textarea id="json" spellcheck="false"></textarea><p id="status"></p><p><button class="btn" id="save">Enregistrer</button></p>`;
    $('json').value = JSON.stringify(rules, null, 1);
    const check = () => { const p = parsed(); const problems = p.error ? [p.error] : spec.validate(p.def); $('status').innerHTML = problems.length ? `<span class="ko">${problems.map(esc).join('<br>')}</span>` : `<span class="ok">✓ ${spec.ok}</span>`; $('save').disabled = problems.length > 0; };
    $('json').oninput = check; check();
    $('save').onclick = async () => {
      const next = parsed().def, r = await fetch('/api/save/' + file + '?mod=' + encodeURIComponent(MOD.id), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(next) });
      const body = await r.json().catch(() => ({}));
      if (r.ok) watchRegeneration();
      $('status').innerHTML = r.ok ? '<span class="ok">✓ enregistré (rechargez le jeu)</span>' : `<span class="ko">Refusé : ${esc((body.problems || [body.failure]).join(' / '))}</span>`;
    };
  }
  // Display only: the active tab is lit (aria-pressed).
  const markTab = () => {
    Object.entries({ powers: 'tabPowers', texts: 'tabTexts', rules: 'tabRules', strategies: 'tabStrategies' }).forEach(([m, id]) => $(id).setAttribute('aria-pressed', m === mode));
    document.querySelectorAll('[data-cat]').forEach(b => b.setAttribute('aria-pressed', mode === 'cards' && b.dataset.cat === category));
  };
  $('tabTexts').onclick = async () => { await loadTexts(); mode = 'texts'; markTab(); current = null; main.innerHTML = ''; drawTexts(); };
  $('tabRules').onclick = async () => { mode = 'rules'; markTab(); await showRules('rules'); };
  $('tabStrategies').onclick = async () => { mode = 'strategies'; markTab(); await showRules('strategies'); };
  $('tabPowers').onclick = async () => { await loadTexts(); mode = 'powers'; markTab(); current = null; main.innerHTML = ''; drawList(); };
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = async () => { await loadFiles(); await loadTexts(); mode = 'cards'; category = b.dataset.cat; markTab(); current = null; main.innerHTML = ''; drawList(); });
  function drawUses(id) {
    const uses = EditorCore.usageOf(id, env), box = $('uses');
    if (box) box.innerHTML = uses.length ? `<div class="cartes">${uses.map(u => `<figure class="vignette">${cardPicture(u)}<figcaption>${esc(u.name)} <small>${u.kind}</small></figcaption></figure>`).join('')}</div>` : '<p><em>aucune carte</em></p>';
  }
  function select(id) {
    current = id; drawList();
    main.innerHTML = `<h2>${esc(id)} <small>(${EditorCore.kindOf(defs[id])})</small></h2>
      <section class="bloc"><h3>1. Modèle du pouvoir</h3>
        <textarea id="json" spellcheck="false"></textarea>
        <p id="status"></p></section>
      <section class="bloc"><h3>2. Description</h3>
        <p>Français <input type="text" id="dfr" style="width:100%"></p>
        <p>English <input type="text" id="den" style="width:100%" placeholder="(non traduit)"></p>
        <p class="essai">Valeurs d'essai : a <input type="number" id="pa" value="2"> h <input type="number" id="ph" value="2"> n <input type="number" id="pn" value="1"> graine <input type="number" id="seed" value="1"></p>
        <div id="desc" class="rendu"></div></section>
      <section class="bloc"><h3>3. Enregistrer et essayer</h3>
        <p><button class="btn" id="save">Enregistrer</button><button class="btn" id="try">Essayer sur un plateau d'exemple</button></p>
        <div id="sandbox"><p class="discret">Le bouton « Essayer » joue le pouvoir sur un plateau d'exemple avec les valeurs d'essai, et montre le plateau avant et après.</p></div></section>
      <section class="bloc"><h3>4. Cartes qui utilisent ce pouvoir</h3><div id="uses"></div></section>`;
    drawUses(id);
    $('json').value = JSON.stringify(defs[id], null, 1);
    $('dfr').value = texts.fr['desc.' + id] || ''; $('den').value = texts.en['desc.' + id] || '';
    $('dfr').oninput = $('den').oninput = $('pa').oninput = $('ph').oninput = $('pn').oninput = refresh;
    $('json').oninput = refresh; $('try').onclick = tryIt; $('save').onclick = save;
    refresh();
  }
  function parsed() { try { return { def: JSON.parse($('json').value) }; } catch (e) { return { error: 'JSON invalide : ' + e.message }; } }
  function refresh() {
    const p = parsed(), st = $('status'), save = $('save');
    if (p.error) { st.innerHTML = `<span class="ko">${esc(p.error)}</span>`; save.disabled = true; return; }
    const problems = POWERS.validate(p.def);
    st.innerHTML = problems.length ? `<span class="ko">${problems.map(esc).join('<br>')}</span>` : '<span class="ok">✓ modèle valide</span>';
    save.disabled = problems.length > 0;
    const params = { a: +$('pa').value, h: +$('ph').value, n: +$('pn').value }, fr = $('dfr').value, en = $('den').value;
    $('desc').innerHTML = [['FR', fr], ['EN', en]].filter(([, t]) => t).map(([l, t]) => `<p><b>${l}</b> ${esc(I18N.format(t, params))}</p>`).join('') || '<p class="discret">Aucune description.</p>';
    if (en && EditorCore.placeholdersOf(fr).join() !== EditorCore.placeholdersOf(en).join()) {
      st.innerHTML += '<br><span class="ko">Les {paramètres} diffèrent entre la description française et l\'anglaise.</span>'; save.disabled = true;
    }
  }
  function tryIt() {
    const p = parsed(); if (p.error) return;
    const kind = EditorCore.kindOf(p.def), d = kind === 'reaction' || kind === 'aura' ? null : p.def;
    if (!d) { $('sandbox').innerHTML = kind === 'aura' ? '<p>Une aura se teste avec tools/check-aura.js.</p>' : '<p>Les réactions se testent en combat (tools/check-order.js, tools/check-boss-boards.js).</p>'; return; }
    const r = EditorCore.runSandbox(env, { ...defs, [current]: p.def }, current, { a: +$('pa').value, h: +$('ph').value, n: +$('pn').value }, +$('seed').value);
    $('sandbox').innerHTML = `<p>Porteur du pouvoir : <b>${esc(r.carrier)}</b> · a=${$('pa').value}, h=${$('ph').value}, n=${$('pn').value}, graine ${$('seed').value}</p>
      <div class="plateaux">${compare('Vos alliés', r.before.allies, r.after.allies)}${compare('Ennemis', r.before.enemies, r.after.enemies)}</div>
      <details><summary>Journal détaillé</summary><pre>${esc(r.log.join('\n') || '(vide)')}</pre></details>`;
  }
  async function save() {
    const p = parsed(); if (p.error) return;
    const next = { ...defs, [current]: p.def };
    const r = await fetch('/api/save/powers?mod=' + encodeURIComponent(MOD.id), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(next) });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) { $('status').innerHTML = `<span class="ko">Refusé : ${esc((body.problems || [body.failure || r.status]).join(' / '))}</span>`; return; }
    defs = next; POWERS.install(defs);
    for (const [lang, id] of [['fr', 'dfr'], ['en', 'den']]) {
      const key = 'desc.' + current, v = $(id).value.trim();
      if (v === (texts[lang][key] || '') || (!v && !(key in texts[lang]))) continue;
      const nextTexts = { ...texts[lang], [key]: v };
      const rt = await fetch('/api/save/i18n-' + lang + '?mod=' + encodeURIComponent(MOD.id), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(nextTexts) });
      if (!rt.ok) { $('status').innerHTML = `<span class="ko">Description refusée (${lang})</span>`; return; }
      texts[lang] = nextTexts;
    }
    await refreshGame(); watchRegeneration();
    $('status').innerHTML = '<span class="ok">✓ enregistré (modèle dans data/powers.json, descriptions dans data/i18n)</span>';
  }
  await loadTexts();
  $('filter').oninput = () => (mode === 'texts' ? drawTexts() : drawList()); drawList();
})().catch(e => { document.getElementById('main').textContent = 'Erreur : ' + e.message; });
</script>
</body>
</html>
