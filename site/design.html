.icones { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: .6rem; margin: .6rem 0; } .icones figure { margin: 0; text-align: center; border: 1px solid var(--line); padding: .5rem; background: var(--surface-1); } .icones svg { width: 4.5rem; height: 4.5rem; background: #0a0b0f; display: block; margin: 0 auto .3rem; } .icones .apercu-petit { display: block; } .icones .apercu-petit svg { width: 1.75rem; height: 1.75rem; margin: 0 auto; background: #0a0b0f; } .icones figcaption { font-size: .8rem; } .icones .discret { display: block; } .icones button { margin-top: .3rem; }

<h1>Design du jeu</h1>
<p class="discret">Référence du design : le système commun, le moteur du jeu et le mod Atlas Wanderer. Source : <code>documentation/interface/design-system.md</code>.</p>
<div class="outils"><button class="bouton plein" id="copier" type="button" disabled>Copier le Markdown</button>
  <label class="discret"><input type="checkbox" id="avec" checked> avec les sources SVG et le gabarit des cartes</label><span id="etat" class="discret" role="status"></span></div>

<script>
// A small Markdown reader for the subset the design page uses: headings, paragraphs, lists, tables, code, bold, italic.
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*]+)\*/g, '$1<em>$2</em>');
function render(md) {
  const out = [], lines = md.split('\n'); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const code = []; for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]); i++; out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); continue; }
    const h = /^(#{1,4}) (.*)/.exec(l); if (h) { const n = Math.max(2, h[1].length); if (h[1].length > 1) out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^\|/.test(l) && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1] || '')) {
      const cells = r => r.replace(/^\||\|\s*$/g, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
      const head = cells(l); i += 2; const rows = [];
      for (; i < lines.length && /^\|/.test(lines[i]); i++) rows.push(cells(lines[i]));
      out.push('<table><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>'); continue;
    }
    const li = /^(\s*)([-*]|\d+\.) (.*)/.exec(l);
    if (li) { const tag = /\d/.test(li[2]) ? 'ol' : 'ul', items = []; for (; i < lines.length; i++) { const m = /^(\s*)([-*]|\d+\.) (.*)/.exec(lines[i]); if (m) items.push(m[3]); else if (/^\s+\S/.test(lines[i]) && items.length) items[items.length - 1] += ' ' + lines[i].trim(); else break; } out.push(`<${tag}>` + items.map(t => `<li>${inline(t)}</li>`).join('') + `</${tag}>`); continue; }
    if (!l.trim()) { i++; continue; }
    const p = []; for (; i < lines.length && lines[i].trim() && !/^(#|```|\||\s*([-*]|\d+\.) )/.test(lines[i]); i++) p.push(lines[i]); out.push('<p>' + inline(p.join(' ')) + '</p>');
  }
  return out.join('\n');
}
// The sources an agent needs to work on the cards: the frames (SVG) and the layout that says where the zones are (ui.cards of game.json).
const MOD_DIR = '../data/atlas-wanderer/';
const FRAMES = [['compact.svg', 'Carte compacte : serviteur (plaques ATQ et PV)'], ['compact-equipment.svg', 'Carte compacte : équipement (sans plaques)'], ['servant.svg', 'Grande carte : serviteur'], ['servant-fusion.svg', 'Grande carte : serviteur doré (fusion)'], ['equipment.svg', 'Grande carte : équipement'], ['hero.svg', 'Grande carte : héros']];
const copy = async text => { try { await navigator.clipboard.writeText(text); } catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); } };   // no clipboard API on file:// or an old browser
(async () => {
  const doc = document.getElementById('doc'), btn = document.getElementById('copier'), etat = document.getElementById('etat'), avec = document.getElementById('avec'), annexe = document.getElementById('annexe');
  const say = t => { etat.textContent = t; setTimeout(() => { etat.textContent = ''; }, 3000); };
  const md = await (await fetch('../documentation/interface/design-system.md')).text();
  doc.innerHTML = render(md);
  const frames = await Promise.all(FRAMES.map(async ([f, label]) => ({ f, label, svg: (await (await fetch(MOD_DIR + 'frames/' + f)).text()).trim() })));
  const cards = (await (await fetch(MOD_DIR + 'game.json')).json()).ui.cards, layout = JSON.stringify(cards, null, 1);
  const voc = await (await fetch(MOD_DIR + 'vocabulary.json')).json(), names = await (await fetch(MOD_DIR + 'i18n/fr.json')).json();
  const typeIcons = voc.groups.flatMap(g => g.types).map(id => { const t = voc.types[id], col = t.color || voc.families[t.family]; return { id, name: names['type.' + id] || id, col, svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">${t.icon.split('{c}').join(col).split('{b}').join('#0a0b0f')}</svg>` }; });
  const gradeIcons = Array.from({ length: 7 }, (_, i) => ({ id: 'grade' + (i + 1), name: 'Grade ' + (i + 1), svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">${voc.icons['grade' + (i + 1)]}</svg>` }));
  annexe.innerHTML = '<h2>Annexe : sources</h2><p class="discret">Les cadres se superposent à l\'illustration (fenêtre transparente) ; le gabarit donne, en pourcentage de la carte, où vont l\'illustration, les nombres, les pastilles et les chasses.</p>'
    + frames.map((x, i) => `<details><summary>${esc(x.label)} (<code>frames/${x.f}</code>)</summary><div class="apercu"><img src="${MOD_DIR}frames/${x.f}" alt=""></div><div class="outils"><button class="bouton" type="button" data-i="${i}">Copier ce SVG</button></div><pre><code>${esc(x.svg)}</code></pre></details>`).join('')
    + `<details><summary>Icônes des types (${typeIcons.length})</summary><p class="discret">Un emblème SVG par type (viewBox 24×24, couleur du type déjà appliquée, fond de carte <code>#0a0b0f</code>). Les espèces puis les affectations.</p><div class="icones">${typeIcons.map((x, i) => `<figure>${x.svg}<figcaption>${esc(x.name)}<span class="discret">${x.col}</span></figcaption><button class="bouton" type="button" data-i="t${i}">Copier</button></figure>`).join('')}</div></details>`
    + `<details><summary>Grades des cartes (7)</summary><p class="discret">Niveau d'un serviteur ou d'un équipement : autant d'étoiles que le grade, toutes dorées, de même taille, dans un hexagone (viewBox 24×24, couleurs fixes, icônes <code>grade1</code> à <code>grade7</code> de <code>vocabulary.json</code>). Affichées dans l'hexagone en haut à droite des cartes.</p><div class="icones">${gradeIcons.map((x, i) => `<figure>${x.svg}<figcaption>${x.name}</figcaption><span class="apercu-petit">${x.svg.replace('width="24" height="24"', 'width="28" height="28"')}</span><button class="bouton" type="button" data-i="g${i}">Copier</button></figure>`).join('')}</div></details>`
    + `<details><summary>Gabarit des cartes (<code>ui.cards</code> de <code>game.json</code>)</summary><div class="outils"><button class="bouton" type="button" data-i="layout">Copier le gabarit</button></div><pre><code>${esc(layout)}</code></pre></details>`;
  annexe.addEventListener('click', async e => { const b = e.target.closest('button[data-i]'); if (!b) return; await copy(b.dataset.i === 'layout' ? layout : b.dataset.i[0] === 't' ? typeIcons[+b.dataset.i.slice(1)].svg : b.dataset.i[0] === 'g' ? gradeIcons[+b.dataset.i.slice(1)].svg : frames[+b.dataset.i].svg); say('Copié.'); });
  const full = () => md + '\n\n## Annexe : sources\n\nLes cadres (SVG, à superposer à l\'illustration) les icônes des types, puis le gabarit des cartes (`ui.cards` de `game.json`).\n\n'
    + frames.map(x => `### \`frames/${x.f}\` : ${x.label}\n\n\`\`\`svg\n${x.svg}\n\`\`\`\n`).join('\n') + `\n### Icônes des types (emblèmes SVG, viewBox 24×24, couleur du type appliquée)\n\n` + typeIcons.map(x => `#### ${x.name} (\`${x.id}\`, ${x.col})\n\n\`\`\`svg\n${x.svg}\n\`\`\`\n`).join('\n') + `\n### Gabarit des cartes (\`ui.cards\`)\n\n\`\`\`json\n${layout}\n\`\`\`\n`;
  btn.disabled = false;
  btn.addEventListener('click', async () => { const text = avec.checked ? full() : md; await copy(text); say('Copié (' + text.length.toLocaleString('fr-FR') + ' caractères).'); });
})().catch(e => { document.getElementById('doc').innerHTML = '<p class="ko">Erreur : ' + e.message + ' (la page se lit depuis le serveur local : node tools/local-server.js)</p>'; });
</script>
