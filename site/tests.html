<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="space.css">

<link rel="stylesheet" href="site.css?v=4">
<style>
  /* Buttons, tabs, fields, panels and notices: site.css. Only the specifics of the test console are here. */
  :root { --orange: var(--dev); --fort: var(--danger); --faible: var(--info); --bon: var(--ok); --alerte: var(--warn); }
  .page.large { max-width: 1400px; }
  .onglets { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 14px; }
  .sous-onglets { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .outils { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; margin: 10px 0; }
  /* The table scrolls inside its frame: the header (top) and the name column (left) stay visible. */
  .defile { max-height: calc(100vh - 130px); }
  table.t { width: 100%; font-size: .88rem; }
  table.t th, table.t td { padding: 5px 10px; text-align: center; white-space: nowrap; border-bottom: 1px solid rgba(130, 170, 230, .08); }
  table.t th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); color: var(--ink-dim); font: 600 .74rem/1.3 var(--font-display); letter-spacing: var(--track-label); text-transform: uppercase; cursor: pointer; user-select: none; box-shadow: 0 1px 0 var(--line-strong); transition: color var(--t-fast); }
  table.t td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface-2); }
  table.t th:first-child { left: 0; z-index: 3; }
  table.t tbody tr:hover td:first-child { background: var(--surface-3); }
  table.t th:hover { color: var(--ink); }
  table.t th.tri { color: var(--dev); }
  table.t th.tri::after { content: " ▾"; }
  table.t th.tri.asc::after { content: " ▴"; }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  table.t tbody tr { transition: background var(--t-fast); }
  table.t tbody tr:hover { background: rgba(92, 212, 240, .06); }
  .score { display: inline-block; min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .score.fort { color: var(--fort); } .score.faible { color: var(--faible); } .score.nul { color: var(--ink-dim); font-weight: 400; }
  .alerte-s { color: var(--alerte); font-size: .78rem; margin-left: 4px; }
  .pos { color: var(--bon); } .neg { color: var(--fort); } .nul { color: var(--ink-dim); }
  .barre { display: inline-block; height: 6px; background: var(--orange); vertical-align: middle; margin-right: 6px; opacity: .8; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 4px 20px; font-size: .88rem; }
  .meta b { color: var(--ink-dim); font: 600 .68rem/1.4 var(--font-display); letter-spacing: var(--track-label); text-transform: uppercase; display: block; }
  pre.rapport { max-height: 70vh; font-size: .78rem; line-height: 1.4; }
  .chaleur td { text-align: center; }
  .case { display: flex; flex-direction: row !important; align-items: center; gap: 5px !important; color: var(--ink) !important; font-size: .9rem !important; text-transform: none !important; letter-spacing: 0 !important; }
  .grille2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  svg.courbe { width: 100%; height: 260px; background: rgba(0, 0, 0, .3); border-radius: var(--r-2); border: 1px solid var(--line); }
  #aide b { text-transform: uppercase; letter-spacing: .04em; }
  .ref { cursor: help; border-bottom: 1px dotted rgba(230, 235, 245, .4); }
  #aide { position: fixed; z-index: 320; display: none; pointer-events: none; max-width: 290px; padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--dev); border-radius: var(--r-1); box-shadow: var(--shadow-2); font-size: .82rem; line-height: 1.4; text-align: left; }
  #aide b { display: block; color: var(--dev); font: 700 .72rem/1.4 var(--font-display); margin-bottom: 2px; }
  #aide span { display: block; color: var(--ink); }
  #apercu { position: fixed; z-index: 300; display: none; pointer-events: none; padding: 0; background: #0b1020; border-radius: 16px; box-shadow: var(--shadow-2); }
  #apercu svg { display: block; width: 100%; height: auto; }
  @media (max-width: 700px) { .grille2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="espace"></div>
<header class="entete"><div>
  <a class="marque" href="../index.html">Atlas Wanderer</a>

</div></header>
<main class="page large">
<h1>Tests d'équilibrage</h1>
<p class="discret">Page de développement, visible seulement en local. Chaque test est enregistré dans <code>tests/history/</code> et versionné avec le projet.</p>
<div id="contenu"><p class="discret">Chargement…</p></div>
</main>
<script src="link-test.js"></script>
<script>
'use strict';
// ---------- Local-only access ----------
const LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const content = document.getElementById('contenu');
if (!LOCAL) { content.innerHTML = '<div class="boite alerte">Cette page n\'est disponible qu\'en local. Lancez <code>node tools/local-server.js</code> puis ouvrez <code>http://localhost:8080/site/tests.html</code>.</div>'; throw new Error('local seulement'); }

// ---------- Utilities ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = x => x == null ? '–' : (x * 100).toFixed(1) + ' %';
const pts = x => x == null ? '–' : (x >= 0 ? '+' : '') + (x * 100).toFixed(1);
const cls = x => x == null || Math.abs(x) < 0.0005 ? 'nul' : x > 0 ? 'pos' : 'neg';
const duration = s => !s ? '–' : s >= 3600 ? `${Math.floor(s / 3600)} h ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')} min` : s >= 60 ? `${Math.round(s / 60)} min` : `${s} s`;
const dateFr = iso => new Date(iso).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' });
const count = n => n.toLocaleString('fr-FR');
// Verdict score: gap in win points (versus the rest, or versus cards of the same rank) when it is reliable enough (z ≥ 3), otherwise 0.
// Positive = too strong, negative = too weak: sorting on this number ranks from strongest to weakest.
const scoreOf = (phase, l) => { const [d, z] = phase === 'servants' || phase === 'equipment' ? [l.rankGap, l.rankZ] : [l.delta, l.z]; return d != null && Math.abs(z) >= 3 ? d : 0; };
const scoreHtml = sc => sc === undefined ? '' : `<b class="score ${sc > 0 ? 'fort' : sc < 0 ? 'faible' : 'nul'}">${sc === 0 ? '0' : pts(sc)}</b> `;
const verdictHtml = (v, sc) => scoreHtml(sc) + verdictBadge(v);
// Only the "depends on the strategy" marker remains in addition to the score: the figure already says whether the element is too strong (positive) or too weak (negative).
const verdictBadge = v => v && v.includes('⚠') ? '<span class="alerte-s" title="Le résultat change de sens selon la stratégie du bot">⚠ stratégie</span>' : '';
const cache = new Map();
// The results record the name each card bore at the time of the test. Since identifiers are fixed, we replace everywhere (pairs, lists, Boss effects…)
// the old names with the current names of the catalog: a renamed element stays recognized from one test to the next.
const renames = new Map();   // old names -> current names, seen in the results already loaded (also used for the text reports)
const replaceNames = (txt, replacement) => { replacement.forEach((nv, old) => { txt = txt.split(old).join(nv); }); return txt; };
const refreshNames = d => {
  const names = (E.cat && E.cat.names) || {}, replacement = new Map();
  const walk = x => { if (!x || typeof x !== 'object') return; if (typeof x.id === 'string' && typeof x.name === 'string') for (const t of Object.values(names)) if (t[x.id] && t[x.id] !== x.name) replacement.set(x.name, t[x.id]); Object.values(x).forEach(walk); };
  walk(d);
  replacement.forEach((nv, old) => renames.set(old, nv));
  if (!replacement.size) return d;
  let txt = JSON.stringify(d);
  replacement.forEach((nv, old) => { txt = txt.split(JSON.stringify(old).slice(1, -1)).join(JSON.stringify(nv).slice(1, -1)); });
  return JSON.parse(txt);
};
const load = (id, file, text) => {
  const key = `${id}/${file}`;
  if (!cache.has(key)) cache.set(key, fetch(`../tests/history/${id}/${file}?_=${Date.now()}`).then(r => { if (!r.ok) throw new Error(r.status); return text ? r.text() : r.json().then(refreshNames); }).catch(() => null));
  return cache.get(key);
};
const api = (urlPath, opts) => fetch(urlPath, opts).then(r => r.json().then(j => { if (!r.ok) throw new Error(j.failure || r.status); return j; }));

// Name of an element with a preview of its card on hover (card rendered by the local server: /api/card/<kind>/<id>).
const refHtml = (genre, id, name) => `<span class="ref" data-k="${genre}" data-id="${esc(id)}">${esc(name)}</span>`;
const GENRE = { lieutenants: 'hero', servants: 'servant', equipment: 'equip', dungeons: 'dungeon' };
(() => {
  const box = document.createElement('div'); box.id = 'apercu'; document.body.appendChild(box);
  const memo = new Map(); let current = null, tempo = null, last = null;
  const place = e => { const w = box.offsetWidth, h = box.offsetHeight; let x = e.clientX + 18, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 18; if (y + h > innerHeight - 8) y = innerHeight - h - 8; box.style.left = Math.max(8, x) + 'px'; box.style.top = Math.max(8, y) + 'px'; };
  const hide = () => { current = null; clearTimeout(tempo); box.style.display = 'none'; };
  document.addEventListener('mouseover', e => {
    last = e; const r = e.target.closest && e.target.closest('.ref');
    if (!r) return hide();
    if (r === current) return;
    hide(); current = r;
    tempo = setTimeout(async () => {
      const key = `${r.dataset.k}/${r.dataset.id}`;
      if (!memo.has(key)) memo.set(key, fetch(`/api/card/${key}`).then(x => x.ok ? x.json() : null).then(j => j && j.svg).catch(() => null));
      const svg = await memo.get(key);
      if (current !== r || !svg) return;
      box.style.width = (r.dataset.k === 'dungeon' ? 340 : 250) + 'px'; box.innerHTML = svg; box.style.display = 'block'; place(last);
    }, 120);
  });
  document.addEventListener('mousemove', e => { last = e; if (box.style.display === 'block') place(e); });
  document.addEventListener('scroll', hide, true);
})();

// Displayed names of the automatic player's strategies (the identifiers level / balanced / tempo are those of the files).
const STRAT = { level: 'Montée rapide', balanced: 'Montée moyenne', tempo: 'Montée lente' };
const strategyName = s => STRAT[s] || s;
const PHASES = { lieutenants: 'Lieutenants', servants: 'Serviteurs', equipment: 'Équipements', dungeons: 'Donjons' };
const E = { tests: [], info: null, cat: { speciesList: [], archetypes: [], lieutenants: {} }, tab: 'resultats', test: null, phase: 'lieutenants' };
const tn = t => (E.cat.typeNames || {})[t] || t;   // displayed name of a type (the catalog gives identifier -> name)

// ---------- Column help (tooltip on hovering the titles) ----------
const HELP = {
  'Lieutenant': 'Nom du lieutenant. Survolez-le pour voir sa carte.', 'Serviteur': 'Nom du serviteur. Survolez-le pour voir sa carte.', 'Équipement': 'Nom de l\'équipement. Survolez-le pour voir sa carte.', 'Donjon': 'Nom du donjon. Survolez-le pour voir sa carte.',
  'Paire': 'Les deux lieutenants joués ensemble.', 'Espèce': 'Espèce (type racial) : Elk, Dwork, Droïde, Sorvane, Ryskan ou Nythe.', 'Archétype': 'Archétype (rôle) : Pilote, Ingénieur, Médecin, etc.',
  'Famille': 'Espèce (type racial) ou archétype (rôle).', 'ATQ moyen': 'Attaque moyenne de ces cartes.', 'PV moyen': 'Points de vie moyens de ces cartes.', '+ATQ moyen': 'Attaque moyenne donnée par ces équipements.', '+PV moyen': 'Points de vie moyens donnés par ces équipements.',
  'PV': 'Points de vie.', 'ATQ': 'Attaque.', '+ATQ': 'Attaque donnée au porteur.', '+PV': 'Points de vie donnés au porteur.', 'Rang': 'Rang de la carte : le niveau de renfort à atteindre pour la trouver.',
  'Montée rapide': 'Victoires du joueur automatique qui monte très vite le niveau de renfort (c\'est la façon de jouer qui gagne le plus).', 'Montée moyenne': 'Victoires du joueur automatique qui monte le niveau de renfort à un rythme moyen.', 'Montée lente': 'Victoires du joueur automatique qui monte lentement le niveau de renfort et privilégie les serviteurs.',
  'Moyenne': 'Victoires moyennes, toutes stratégies et tous donjons confondus.', 'Victoires': 'Part des parties gagnées.', 'Attendu': 'Victoires attendues d\'après les deux lieutenants pris séparément.',
  'Écart': 'Points de victoires de plus (ou de moins) que le reste.', 'Synergie': 'Victoires de la paire moins ce qu\'on attendait d\'après ses deux lieutenants : positif s\'ils se complètent, négatif s\'ils se gênent.',
  'Fiabilité': 'Indice de fiabilité de l\'écart (z) : au-delà de 3, ce n\'est pas dû au hasard.', 'Salles': 'Nombre moyen de salles atteintes.', 'Gain': 'Points de victoires gagnés (ou perdus) par rapport aux parties témoins quand la carte est donnée au joueur.',
  'Présence': 'Part des parties où la carte a pu être donnée au joueur.',
  'Score': 'Écart en points de victoires avec le reste (ou avec les cartes de même rang) quand il est sûr (z ≥ 3), sinon 0. Positif : trop fort ; négatif : trop faible. ⚠ : le résultat change de sens selon la stratégie.',
  'PV Boss': 'Points de vie du Boss du donjon.', 'Salle de défaite': 'Salle où le joueur perd : 25 % / médiane / 75 % des défaites.', 'Test': 'Date et échelle du test.', 'Mesure': 'Valeur de la mesure choisie pour ce test.',
  'Changements': 'Ce qui a changé depuis le test précédent : cartes ou règles du jeu, joueur automatique.', 'Note': 'Commentaire enregistré avec le test.', 'Avant': 'Valeur dans le premier test.', 'Après': 'Valeur dans le second test.',
  'Changement (points)': 'Différence entre les deux tests, en points de victoires.', 'Score avant': 'Score dans le premier test (0 : écart pas assez sûr).', 'Score après': 'Score dans le second test (0 : écart pas assez sûr).', 'Type': 'Type de l\'équipement.'
};
(() => {
  const box = document.createElement('div'); box.id = 'aide'; document.body.appendChild(box);
  let current = null, tempo = null;
  const hide = () => { current = null; clearTimeout(tempo); box.style.display = 'none'; };
  const display = th => {
    if (current !== th) return;
    const text = th.dataset.help;
    box.innerHTML = `<b>${th.textContent}</b>${text ? `<span>${text}</span>` : ''}`; box.style.display = 'block';
    const r = th.getBoundingClientRect(), w = box.offsetWidth;
    box.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px'; box.style.top = (r.bottom + 6) + 'px';
  };
  document.addEventListener('mouseover', e => {
    const th = e.target.closest && e.target.closest('table.t th');
    if (!th) { if (current) hide(); return; }
    if (th === current) return;
    const already = box.style.display === 'block';
    current = th; clearTimeout(tempo);
    if (already) display(th); else tempo = setTimeout(() => display(th), 180);   // already open: we move from one title to the next without delay
  });
  document.addEventListener('click', hide); document.addEventListener('scroll', hide, true);
})();

// ---------- Sortable table ----------
// columns: { title, val(row) for sorting, renderFn(row) HTML, g: left-aligned, help }
function tableau(container, columns, rows, { sort = 0, asc = false } = {}) {
  const state = { sort, asc };
  const draw = () => {
    const c = columns[state.sort], sorted = rows.slice().sort((a, b) => { const x = c.val(a), y = c.val(b); const r = typeof x === 'string' ? x.localeCompare(y, 'fr') : (x ?? -Infinity) - (y ?? -Infinity); return state.asc ? r : -r; });
    container.innerHTML = `<div class="defile"><table class="t"><thead><tr>${columns.map((k, i) => `<th data-i="${i}" class="${i === state.sort ? 'tri' + (state.asc ? ' asc' : '') : ''}" data-aide="${esc(k.help || HELP[k.title] || '')}">${esc(k.title)}</th>`).join('')}</tr></thead><tbody>${sorted.map(l => `<tr>${columns.map(k => `<td class="${k.g ? 'g' : ''}">${k.renderFn(l)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    container.querySelectorAll('th').forEach(th => th.onclick = () => { const i = +th.dataset.i; if (state.sort === i) state.asc = !state.asc; else { state.sort = i; state.asc = typeof columns[i].val(rows[0] || {}) === 'string'; } draw(); });
  };
  draw();
}
const colPts = (title, f, help) => ({ title, val: f, renderFn: l => `<span class="${cls(f(l))}">${pts(f(l))}</span>`, help });
const colPct = (title, f, help) => ({ title, val: f, renderFn: l => pct(f(l)), help });

// ---------- Results tab ----------
async function resultsTab(zone) {
  if (!E.tests.length) { zone.innerHTML = '<div class="boite">Aucun test dans l\'historique. Lancez-en un depuis l\'onglet « Lancer ».</div>'; return; }
  if (!E.test || !E.tests.find(t => t.id === E.test)) E.test = E.tests[0].id;
  const t = E.tests.find(x => x.id === E.test);
  if (!t.requested.includes(E.phase)) E.phase = t.requested[0];
  zone.innerHTML = `
    <div class="outils"><label>Test<select id="sel-test">${E.tests.map(x => `<option value="${x.id}" ${x.id === E.test ? 'selected' : ''}>${esc(testLabel(x))}</option>`).join('')}</select></label>
      <button class="btn danger" id="suppr" title="Supprime ce test de l'historique">Supprimer</button></div>
    <div id="meta"></div>
    <div class="sous-onglets">${t.requested.map(p => `<button data-p="${p}" aria-pressed="${p === E.phase}">${PHASES[p]}</button>`).join('')}<button id="voir-rapport" style="margin-left:auto">Rapport texte</button></div>
    <div id="phase"></div><div id="rapport"></div>`;
  $('#sel-test').onchange = e => { E.test = e.target.value; resultsTab(zone); };
  $('#suppr').onclick = async () => { if (!E.info || !E.info.server) return alert('Suppression possible seulement avec le serveur local.'); if (!confirm(`Supprimer définitivement le test « ${testLabel(t)} » de l'historique ?`)) return; await api(`/api/tests/${t.id}`, { method: 'DELETE' }); await reload(); };
  zone.querySelectorAll('.sous-onglets [data-p]').forEach(b => b.onclick = () => { E.phase = b.dataset.p; resultsTab(zone); });
  $('#meta').innerHTML = metaHtml(t);
  $('#voir-rapport').onclick = async () => { const r = $('#rapport'); if (r.innerHTML) { r.innerHTML = ''; return; } await load(t.id, `${E.phase}.json`); const txt = replaceNames(await load(t.id, `report-${E.phase}.txt`, true) || '', renames); r.innerHTML = `<pre class="rapport">${esc(txt || 'Rapport introuvable.')}</pre>`; };
  const data = await load(t.id, `${E.phase}.json`);
  const zp = $('#phase');
  if (!data) { zp.innerHTML = '<div class="boite alerte">Résultats introuvables pour cette phase.</div>'; return; }
  ({ lieutenants: lieutenantsPhase, servants: (zp, d) => cardsPhase(zp, d, false), equipment: (zp, d) => cardsPhase(zp, d, true), dungeons: dungeonsPhase })[E.phase](zp, data, t);
}
const testLabel = t => `${dateFr(t.date)} · ${t.scale}${t.imported ? ' (importé)' : ''}${t.note ? ' · ' + t.note.slice(0, 60) : ''}`;
function metaHtml(t) {
  const info = E.info, warning = [];
  if (info && info.hashDonnees && t.hashDonnees !== info.hashDonnees) warning.push('Les cartes ou les règles du jeu (data.js, engine.js) ont changé depuis ce test : relancer pour voir l\'effet actuel.');
  if (info && info.hashBot && t.hashBot !== info.hashBot) warning.push('Le joueur automatique a changé depuis ce test : ses résultats ne sont pas comparables à ceux d\'un test récent.');
  const games = Object.values(t.phases || {}).reduce((a, p) => a + (p.games || 0), 0);
  return `<div class="boite${warning.length ? ' alerte' : ''}"><div class="meta">
    <div><b>Date</b>${dateFr(t.date)}</div><div><b>Échelle</b>${t.scale}${t.factor && t.factor !== 1 ? ' × ' + t.factor : ''}</div><div><b>Parties jouées</b>${count(games)}</div><div><b>Durée</b>${duration(t.seconds)}</div>
    <div><b>Graine</b>${t.seed}</div><div><b>Stratégies du bot</b>${esc((t.strategies || []).map(strategyName).join(', '))}${t.cardStrategies && t.cardStrategies.join() !== (t.strategies || []).join() ? ' · cartes : ' + esc(t.cardStrategies.map(strategyName).join(', ')) : ''}</div>
    <div><b>Commit du jeu</b>${esc(t.commit || '?')}${t.modified ? ' + modifications' : ''}</div><div><b>Empreintes</b>jeu ${esc(t.hashDonnees)} · bot ${esc(t.hashBot)}</div></div>
    ${t.note ? `<p style="margin:8px 0 0"><b style="color:var(--discret);font-weight:500">Note :</b> ${esc(t.note)}</p>` : ''}
    ${warning.map(a => `<p class="alerte-s" style="margin:6px 0 0;font-size:.85rem">⚠ ${esc(a)}</p>`).join('')}</div>`;
}

function lieutenantsPhase(zp, d, t) {
  const strats = d.options.strategies, dj = d.dungeons || [0, 1, 2, 3].map(i => ({ name: 'Donjon ' + (i + 1) }));
  const cl = id => E.cat.lieutenants[id] || { types: [], hp: null }, species = id => cl(id).types.filter(t => E.cat.speciesList.includes(t)).map(tn).join(', '), archetype = id => cl(id).types.filter(t => E.cat.archetypes.includes(t)).map(tn).join(', ');
  const cols = [{ title: 'Lieutenant', g: 1, val: l => l.name, renderFn: l => refHtml('hero', l.id, l.name) },
    { title: 'Espèce', g: 1, val: l => species(l.id), renderFn: l => esc(species(l.id)) }, { title: 'Archétype', g: 1, val: l => archetype(l.id), renderFn: l => esc(archetype(l.id)) }, { title: 'PV', val: l => cl(l.id).hp ?? 0, renderFn: l => cl(l.id).hp ?? '–', help: 'Points de vie du lieutenant' },

// Average per species and per archetype: all the cards that carry the type, accumulated, to spot a globally too strong type.

  const strats = d.options.strategies;

    const cs = d.cardList.filter(c => c.types.includes(g.type)), n = cs.length; if (!n) return null;

// ---------- Evolution tab ----------
const METRICS = { lieutenants: [['rate', 'Victoires (moyenne)'], ['delta', 'Écart aux autres']], servants: [['delta', 'Gain'], ['rankGap', 'Gain par rapport aux cartes de même rang']], equipment: [['delta', 'Gain'], ['rankGap', 'Gain par rapport aux cartes de même rang']], dungeons: [['rate', 'Victoires (moyenne)'], ['delta', 'Écart aux autres donjons']] };
const rowsOf = (phase, d) => phase === 'lieutenants' ? d.lieutenants : phase === 'dungeons' ? d.dungeons : d.cardList;
async function evolutionTab(zone) {
  if (!E.evo) E.evo = { phase: 'lieutenants', element: '', metric: 'rate' };
  const ev = E.evo, using = E.tests.filter(t => t.requested.includes(ev.phase)).slice().reverse();
  const data = (await Promise.all(using.map(t => load(t.id, `${ev.phase}.json`)))).map((d, i) => ({ t: using[i], d }));
  const tous = new Map(); data.forEach(({ d }) => d && rowsOf(ev.phase, d).forEach(l => tous.set(l.id, l.name)));
  const ids = [...tous.keys()].sort((a, b) => tous.get(a).localeCompare(tous.get(b), 'fr'));
  if (!tous.has(ev.element)) ev.element = ids[0];
  if (!METRICS[ev.phase].some(m => m[0] === ev.metric)) ev.metric = METRICS[ev.phase][0][0];
  zone.innerHTML = `<p class="discret">Évolution d'un élément à travers tous les tests de l'historique. Un point creux signale que les cartes ou les règles ont changé par rapport au test précédent ; un point barré que le joueur automatique a changé (comparaison peu fiable).</p>
    <div class="outils"><label>Catégorie<select id="e-ph">${Object.entries(PHASES).map(([k, v]) => `<option value="${k}" ${k === ev.phase ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label>Élément<select id="e-el">${ids.map(i => `<option value="${esc(i)}" ${i === ev.element ? 'selected' : ''}>${esc(tous.get(i))}</option>`).join('')}</select></label>
    <label>Mesure<select id="e-me">${METRICS[ev.phase].map(([k, v]) => `<option value="${k}" ${k === ev.metric ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div><div id="e-res"></div>`;
  $('#e-ph').onchange = e => { ev.phase = e.target.value; ev.element = ''; ev.metric = METRICS[ev.phase][0][0]; evolutionTab(zone); };
  $('#e-el').onchange = e => { ev.element = e.target.value; evolutionTab(zone); };
  $('#e-me').onchange = e => { ev.metric = e.target.value; evolutionTab(zone); };
  const pts_ = data.map(({ t, d }) => { const l = d && rowsOf(ev.phase, d).find(x => x.id === ev.element); return l ? { t, l, v: l[ev.metric] } : null; }).filter(Boolean);
  if (!pts_.length) { $('#e-res').innerHTML = '<div class="boite">Aucun test ne contient cet élément.</div>'; return; }
  const isRate = ev.metric === 'rate', fmt = isRate ? pct : pts;
  let prev = null;
  pts_.forEach(p => { p.data = prev && prev.t.hashDonnees !== p.t.hashDonnees; p.bot = prev && prev.t.hashBot !== p.t.hashBot; prev = p; });
  $('#e-res').innerHTML = curve(pts_, isRate) + `<div id="e-tab" style="margin-top:12px"></div>`;
  const cols = [{ title: 'Test', g: 1, val: p => p.t.date, renderFn: p => esc(dateFr(p.t.date) + ' · ' + p.t.scale) }, { title: 'Mesure', val: p => p.v, renderFn: p => `<span class="${isRate ? '' : cls(p.v)}">${fmt(p.v)}</span>` },
    { title: 'Score', val: p => scoreOf(ev.phase, p.l), renderFn: p => p.l.verdict ? verdictHtml(p.l.verdict, scoreOf(ev.phase, p.l)) : '' },
    { title: 'Changements', g: 1, val: p => (p.data ? 2 : 0) + (p.bot ? 1 : 0), renderFn: p => [p.data ? 'cartes/règles' : '', p.bot ? 'bot' : ''].filter(Boolean).join(', ') || '–' }, { title: 'Note', g: 1, val: p => p.t.note || '', renderFn: p => esc(p.t.note || '') }];
  tableau($('#e-tab'), cols, pts_, { sort: 0 });
}
function curve(p, isRate) {
  const W = 800, H = 260, m = { l: 56, r: 20, t: 16, b: 34 }, vs = p.map(x => x.v);
  let lo = Math.min(...vs), hi = Math.max(...vs); if (hi - lo < 0.02) { lo -= 0.01; hi += 0.01; } if (!isRate) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const x = i => m.l + (p.length === 1 ? (W - m.l - m.r) / 2 : i * (W - m.l - m.r) / (p.length - 1)), y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const ticks = [0, 1, 2, 3, 4].map(k => lo + (hi - lo) * k / 4);
  return `<svg class="courbe" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe d'évolution">
    ${ticks.map(g => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(g)}" y2="${y(g)}" stroke="rgba(255,255,255,.1)"/><text x="${m.l - 8}" y="${y(g) + 4}" text-anchor="end" fill="#9aa4b2" font-size="11">${isRate ? (g * 100).toFixed(0) + ' %' : pts(g)}</text>`).join('')}
    ${!isRate && lo < 0 && hi > 0 ? `<line x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(255,255,255,.4)"/>` : ''}
    <polyline fill="none" stroke="#fb923c" stroke-width="2.5" points="${p.map((q, i) => `${x(i)},${y(q.v)}`).join(' ')}"/>
    ${p.map((q, i) => `<g><circle cx="${x(i)}" cy="${y(q.v)}" r="5.5" fill="${q.data ? '#0b1020' : '#fb923c'}" stroke="#fb923c" stroke-width="2"><title>${esc(dateFr(q.t.date) + ' : ' + (isRate ? pct(q.v) : pts(q.v)))}</title></circle>${q.bot ? `<line x1="${x(i) - 5}" x2="${x(i) + 5}" y1="${y(q.v) + 5}" y2="${y(q.v) - 5}" stroke="#f87171" stroke-width="2"/>` : ''}
      <text x="${x(i)}" y="${H - 12}" text-anchor="middle" fill="#9aa4b2" font-size="10">${esc(new Date(q.t.date).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }))}</text></g>`).join('')}</svg>`;
}

// ---------- Compare tab ----------
async function compareTab(zone) {
  if (E.tests.length < 2) { zone.innerHTML = '<div class="boite">Il faut au moins deux tests dans l\'historique pour comparer.</div>'; return; }
  if (!E.cmp) E.cmp = { a: E.tests[1].id, b: E.tests[0].id, phase: 'lieutenants', metric: 'rate', min: 0 };
  const c = E.cmp, ta = E.tests.find(t => t.id === c.a) || E.tests[1], tb = E.tests.find(t => t.id === c.b) || E.tests[0];
  c.a = ta.id; c.b = tb.id;
  const common = Object.keys(PHASES).filter(p => ta.requested.includes(p) && tb.requested.includes(p));
  if (!common.includes(c.phase)) c.phase = common[0];
  zone.innerHTML = `<p class="discret">Différence entre deux tests : quels éléments ont changé le plus (par exemple après un rééquilibrage).</p>
    <div class="outils"><label>Avant<select id="c-a">${E.tests.map(t => `<option value="${t.id}" ${t.id === c.a ? 'selected' : ''}>${esc(testLabel(t))}</option>`).join('')}</select></label>
    <label>Après<select id="c-b">${E.tests.map(t => `<option value="${t.id}" ${t.id === c.b ? 'selected' : ''}>${esc(testLabel(t))}</option>`).join('')}</select></label>
    <label>Catégorie<select id="c-p">${common.map(p => `<option value="${p}" ${p === c.phase ? 'selected' : ''}>${PHASES[p]}</option>`).join('')}</select></label>
    <label>Mesure<select id="c-m">${METRICS[c.phase].map(([k, v]) => `<option value="${k}" ${k === c.metric ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label>Changement minimal (points)<input type="number" id="c-min" min="0" step="0.5" value="${c.min}" style="width:90px"></label></div><div id="c-res"></div>`;
  ['a', 'b', 'p', 'm'].forEach(k => $('#c-' + k).onchange = e => { const v = e.target.value; if (k === 'a') c.a = v; if (k === 'b') c.b = v; if (k === 'p') { c.phase = v; c.metric = METRICS[v][0][0]; } if (k === 'm') c.metric = v; compareTab(zone); });
  $('#c-min').oninput = e => { c.min = +e.target.value || 0; clearTimeout(c.h); c.h = setTimeout(() => compareTab(zone), 400); };
  if (!common.length) { $('#c-res').innerHTML = '<div class="boite alerte">Ces deux tests n\'ont aucune catégorie en commun.</div>'; return; }
  if (!METRICS[c.phase].some(m => m[0] === c.metric)) c.metric = METRICS[c.phase][0][0];
  const [da, db] = await Promise.all([load(ta.id, `${c.phase}.json`), load(tb.id, `${c.phase}.json`)]);
  const warning = [];
  if (ta.hashBot !== tb.hashBot) warning.push('Le joueur automatique n\'est pas le même dans les deux tests : les écarts peuvent venir du bot et pas du jeu.');
  if (ta.hashDonnees === tb.hashDonnees) warning.push('Les cartes et les règles sont identiques : les écarts viennent seulement du hasard (graine, taille du test) ou du bot.');
  if (ta.scale !== tb.scale) warning.push(`Les tailles de test diffèrent (${ta.scale} / ${tb.scale}) : les petits écarts ne sont pas significatifs.`);
  const A = new Map(rowsOf(c.phase, da).map(l => [l.id, l])), B = new Map(rowsOf(c.phase, db).map(l => [l.id, l]));
  const isRate = c.metric === 'rate', fmt = isRate ? pct : pts;
  const rows = [...new Set([...A.keys(), ...B.keys()])].map(id => { const a = A.get(id), b = B.get(id); return { id, name: (b || a).name, a: a && a[c.metric], b: b && b[c.metric], va: a && a.verdict, vb: b && b.verdict, sa: a && scoreOf(c.phase, a), sb: b && scoreOf(c.phase, b), diff: a && b ? b[c.metric] - a[c.metric] : null }; })
    .filter(l => l.diff == null || Math.abs(l.diff) * 100 >= c.min);
  $('#c-res').innerHTML = warning.map(a => `<div class="boite alerte" style="padding:8px 14px">⚠ ${esc(a)}</div>`).join('') + '<div id="c-tab"></div>';
  tableau($('#c-tab'), [{ title: 'Élément', g: 1, val: l => l.name, renderFn: l => refHtml(GENRE[c.phase], l.id, l.name) }, { title: 'Avant', val: l => l.a, renderFn: l => l.a == null ? 'absent' : `<span class="${isRate ? '' : cls(l.a)}">${fmt(l.a)}</span>` },
    { title: 'Après', val: l => l.b, renderFn: l => l.b == null ? 'absent' : `<span class="${isRate ? '' : cls(l.b)}">${fmt(l.b)}</span>` },
    { title: 'Changement (points)', val: l => l.diff == null ? 99 : Math.abs(l.diff), renderFn: l => l.diff == null ? (l.a == null ? 'nouveau' : 'retiré') : `<span class="${cls(l.diff)}">${pts(l.diff)}</span>` },
    { title: 'Score avant', val: l => l.sa, renderFn: l => l.va ? verdictHtml(l.va, l.sa) : '' }, { title: 'Score après', val: l => l.sb, renderFn: l => l.vb ? verdictHtml(l.vb, l.sb) : '' }],
    rows.map(l => ({ ...l, sort: l.diff == null ? 99 : Math.abs(l.diff) })), { sort: 3 });
}

// ---------- Launch tab ----------
async function launchTab(zone) {
  if (!E.info || !E.info.server) { zone.innerHTML = '<div class="boite alerte">Le lancement de tests demande le serveur local. Dans un terminal, à la racine du projet : <code>node tools/local-server.js</code>, puis rouvrez cette page par <code>http://localhost:8080/site/tests.html</code>. La consultation de l\'historique fonctionne déjà sans lui.</div>'; return; }
  const pr = E.launch || (E.launch = { phase: 'all', scale: 'normal', factor: 1, seed: 1, strategies: ['level', 'balanced', 'tempo'], note: '' });
  zone.innerHTML = `<p class="discret">Lance <code>tools/equilibrage.js</code> sur cette machine. Le résultat est enregistré dans l'historique (<code>tests/history/</code>), à valider et commiter ensuite avec le reste.</p>
    <div class="boite"><div class="outils"><label>Catégorie<select id="l-ph"><option value="tout">Tout (les 4)</option>${Object.entries(PHASES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      <label>Échelle<select id="l-ec">${['small', 'normal', 'massive'].map(k => `<option value="${k}">${k[0].toUpperCase() + k.slice(1)}</option>`).join('')}</select></label>
      <label>Facteur<input type="number" id="l-fa" min="0.1" max="100" step="0.5" style="width:80px"></label><label>Graine<input type="number" id="l-gr" min="0" step="1" style="width:80px"></label>
      <label>Stratégies du bot<span style="display:flex;gap:12px">${['level', 'balanced', 'tempo'].map(s => `<label class="case"><input type="checkbox" data-s="${s}"> ${strategyName(s)}</label>`).join('')}</span></label></div>
    <div class="outils"><label style="flex:1;min-width:260px">Note (ce qu'on veut vérifier, ce qui a changé)<input type="text" id="l-no" maxlength="300" placeholder="Ex. après la baisse des PV de TE-5T"></label></div>
    <p id="l-est" class="discret"></p><button class="btn" id="l-go">Lancer le test</button> <button class="btn sec" id="l-stop" hidden>Annuler</button></div><div id="l-etat"></div>`;
  const update = () => {
    pr.phase = $('#l-ph').value; pr.scale = $('#l-ec').value; pr.factor = +$('#l-fa').value || 1; pr.seed = +$('#l-gr').value || 0; pr.note = $('#l-no').value;
    pr.strategies = [...zone.querySelectorAll('[data-s]')].filter(c => c.checked).map(c => c.dataset.s);
    const n = estimate(pr); $('#l-est').textContent = `Environ ${count(Math.round(n))} parties, soit ${duration(Math.round(n / 260))} sur une machine à 16 cœurs (mesuré : 260 parties par seconde).`;
  };
  $('#l-ph').value = pr.phase; $('#l-ec').value = pr.scale; $('#l-fa').value = pr.factor; $('#l-gr').value = pr.seed; $('#l-no').value = pr.note;
  zone.querySelectorAll('[data-s]').forEach(c => c.checked = pr.strategies.includes(c.dataset.s));
  zone.querySelectorAll('select, input').forEach(e => e.oninput = update); update();
  $('#l-go').onclick = async () => { update(); try { await api('/api/launch', { method: 'POST', body: JSON.stringify(pr) }); follow(); } catch (e) { alert(e.message); } };
  $('#l-stop').onclick = () => api('/api/cancel', { method: 'POST' });
  follow();
}
// Expected number of games, from the size of the game and the scales (same formulas as balance.js).
function estimate(p) {
  const e = E.info.scales[p.scale], T = E.info.size, f = p.factor || 1, S = p.strategies.length || 3, SC = Math.min(S, 2) || 2, c = x => Math.max(1, Math.round(x * f));
  const pairs = T.lieutenants * (T.lieutenants - 1) / 2, d = T.dungeons;
  const L = pairs * d * S * c(e.lieutenants), cardList = n => (n * pairs * d * SC * c(e.cardList)) + pairs * d * SC * c(e.control);
  const D = d * pairs * S * c(e.dungeons) + d * (T.types - 3) * pairs * S * c(e.extras);
  const v = { lieutenants: L, servants: cardList(T.servants), equipment: cardList(T.equipment), dungeons: D };
  return p.phase === 'all' ? Object.values(v).reduce((a, b) => a + b, 0) : v[p.phase];
}
let timer = null;
async function follow() {
  clearTimeout(timer);
  const zone = $('#l-etat'); if (!zone || E.tab !== 'lancer') return;
  let s; try { s = await api('/api/state'); } catch (e) { return; }
  const go = $('#l-go'), stop = $('#l-stop');
  if (!s.active && !s.params) { zone.innerHTML = ''; go.disabled = false; stop.hidden = true; return; }
  go.disabled = s.active; stop.hidden = !s.active;
  const pg = s.progress, p = pg ? pg.done / pg.total : 0;
  zone.innerHTML = `<div class="boite"><b>${s.active ? 'Test en cours' : s.finish && s.finish.code === 0 ? 'Test terminé' : 'Test interrompu'}</b> · ${esc(s.params.phase)} · ${esc(s.params.scale)}${s.phase ? ' · phase ' + esc(s.phase) : ''} · ${duration(s.seconds)}
    ${s.active && pg ? `<div class="progres"><div style="width:${(p * 100).toFixed(1)}%"></div></div><span class="discret">${count(pg.done)} / ${count(pg.total)} tâches de la phase en cours</span>` : ''}
    ${!s.active && s.id ? `<p>Enregistré sous <code>tests/history/${esc(s.id)}</code>. <a href="#" id="l-voir">Voir les résultats</a></p>` : ''}
    <pre class="rapport" style="max-height:260px">${esc((s.rows || []).join('\n'))}</pre></div>`;
  const voir = $('#l-voir'); if (voir) voir.onclick = async e => { e.preventDefault(); await reload(); E.test = s.id; E.tab = 'resultats'; drawTabs(); };
  if (s.active) timer = setTimeout(follow, 1500);
  else if (!E.finished || E.finished !== s.id) { E.finished = s.id; await reload(true); }
}

// ---------- Program ----------
const TABS = [['resultats', 'Résultats', resultsTab], ['evolution', 'Évolution', evolutionTab], ['comparer', 'Comparer', compareTab], ['lancer', 'Lancer un test', launchTab]];
function drawTabs() {
  content.innerHTML = `<div class="onglets">${TABS.map(([k, t]) => `<button data-o="${k}" aria-pressed="${k === E.tab}">${t}</button>`).join('')}</div><div id="zone"></div>`;
  content.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { E.tab = b.dataset.o; clearTimeout(timer); history.replaceState(null, '', '#' + E.tab); drawTabs(); });
  TABS.find(o => o[0] === E.tab)[2]($('#zone'));
}
async function reload(silent) {
  try { E.tests = (await fetch(`../tests/history/index.json?_=${Date.now()}`).then(r => r.json())).tests; } catch (e) { E.tests = []; }
  cache.clear();
  if (!silent) drawTabs();
}
(async () => {
  if (location.protocol === 'file:') { content.innerHTML = '<div class="boite alerte">Le navigateur ne permet pas de lire l\'historique depuis un fichier. Lancez <code>node tools/local-server.js</code> et ouvrez <code>http://localhost:8080/site/tests.html</code>.</div>'; return; }
  try { E.info = await api('/api/info'); } catch (e) { E.info = { server: false }; }
  const h = location.hash.slice(1); if (TABS.some(o => o[0] === h)) E.tab = h;
  try { E.cat = await fetch(`../tests/catalog.json?_=${Date.now()}`).then(r => r.json()); } catch (e) { /* species and archetype columns empty */ }
  await reload();
})();
</script>
