# Checks run on every push and pull request. They prove that a change does not alter the game by accident
# and that the site published on GitHub Pages is complete (same files, same links as the local server).
name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Texts are complete and consistent in every language
        run: node tools/check-texts.js
      - name: Game data is consistent (cards valid, named, no duplicate, removed cards gone)
        run: node tools/check-data.js
      - name: Game behaviour fingerprint (results and combat messages)
        run: node tools/fingerprint.js 400
      - name: The engine still reproduces the original game with the legacy resolution order
        run: node tools/fingerprint.js 400 --legacy-order
      - name: Game randomness goes through rng() only
        run: node tools/fingerprint.js 400 --strict
      - name: Power bricks behave exactly like the legacy code (oracle)
        run: node tools/check-powers.js 400
      - name: Random combats are identical to the legacy engine (oracle)
        run: node tools/check-combat.js 6000
      - name: Simulated games do not crash
        run: node tools/simulate.js 60 6
      - name: Generated files are up to date
        run: |
          node tools/generate-all.js --sans-simulation
          git diff --exit-code
      - name: Site smoke test (pages, scripts, images, texts, data files)
        run: node tools/check-site.js
      - name: Game boots like in a browser (fetch of texts, powers and cards)
        run: node tools/check-boot.js
      - name: Power editor (logic and save API)
        run: node tools/check-editor.js
      - name: Interface renders the same pages (seeded games, fake DOM)
        run: node tools/check-render.js
      - name: English interface shows no missing text
        run: node tools/check-render.js --lang=en
      - name: No undefined name in the game scripts
        run: node tools/check-globals.js
